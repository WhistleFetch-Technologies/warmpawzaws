# =============================================================================
# Delivery service — same DB conventions as customer-service
# =============================================================================
server.port=8082

spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/warmpawz
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.open-in-view=false

# Pidge (optional env overrides; else loaded from logistics_partners partner_type=pidge)
pidge.api-base=${PIDGE_API_BASE:https://api.pidge.in}
pidge.username=${PIDGE_USERNAME:}
pidge.password=${PIDGE_PASSWORD:}
pidge.brand-code=${PIDGE_BRAND_CODE:}
pidge.brand-location-code=${PIDGE_LOCATION_CODE:}
pidge.brand-name=${PIDGE_BRAND_NAME:WarmPawz}
pidge.channel=${PIDGE_CHANNEL:warmpawz}
pidge.default-country=${PIDGE_DEFAULT_COUNTRY:India}
# Store/vendor Pidge accounts must omit brand (PIDGE_OMIT_BRAND=true or omitBrand on JSON body)
pidge.omit-brand-in-create-order=${PIDGE_OMIT_BRAND:false}
pidge.public-api-base-url=${PUBLIC_API_BASE_URL:https://YOUR_API_GATEWAY_OR_DOMAIN}
pidge.webhook-bearer-token=${PIDGE_WEBHOOK_BEARER_TOKEN:}
pidge.webhook-forward-url=${PIDGE_WEBHOOK_FORWARD_URL:}

# Shiprocket / Delhivery / Dunzo — optional env when not in DB (platform_settings parity omitted; use partners table)
shiprocket.email=${SHIPROCKET_EMAIL:}
shiprocket.password=${SHIPROCKET_PASSWORD:}
delhivery.api-token=${DELHIVERY_API_TOKEN:}
delhivery.client-name=${DELHIVERY_CLIENT_NAME:}
dunzo.client-id=${DUNZO_CLIENT_ID:}
dunzo.client-secret=${DUNZO_CLIENT_SECRET:}

# OpenAPI / Swagger "Try it out" base URL (HTTPS). Set in ECS to your API Gateway invoke URL.
warmpawz.openapi.public-server-url=${OPENAPI_PUBLIC_SERVER_URL:}
