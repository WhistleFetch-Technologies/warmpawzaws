# Activated with SPRING_PROFILES_ACTIVE=aws (ECS/Fargate)
server.port=${SERVER_PORT:8082}
server.forward-headers-strategy=framework

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false

pidge.public-api-base-url=${PUBLIC_API_BASE_URL:https://dev.api.warmpawz.com}

warmpawz.meal-delivery-notify.api-base-url=${WARMPAWZ_API_BASE_URL:${PUBLIC_API_BASE_URL:https://dev.api.warmpawz.com}}
warmpawz.meal-delivery-notify.secret=${MEAL_DELIVERY_NOTIFY_SECRET:}
