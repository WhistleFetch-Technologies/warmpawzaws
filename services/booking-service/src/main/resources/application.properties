server.port=8083

# ===============================
# DATABASE
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/warmpawz}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# SCHEMA (VERY IMPORTANT)
# ===============================
spring.jpa.properties.hibernate.default_schema=public

# ===============================
# SECURITY (JWT Resource Server)
# ===============================
app.security.enabled=${APP_SECURITY_ENABLED:true}
app.security.uat-jwt.enabled=${APP_SECURITY_UAT_JWT_ENABLED:false}
app.security.uat-jwt.secret=${UAT_JWT_SECRET:}
app.security.uat-jwt.audience=${APP_SECURITY_UAT_JWT_AUDIENCE:warmpawz-api}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI:}
spring.security.oauth2.resourceserver.jwt.audiences=${COGNITO_AUDIENCE:}

# ===============================
# CACHING + IDEMPOTENCY
# ===============================
app.cache.read-ttl-seconds=${APP_CACHE_READ_TTL_SECONDS:60}
app.cache.idempotency-ttl-seconds=${APP_CACHE_IDEMPOTENCY_TTL_SECONDS:60}
app.cache.read-max-size=${APP_CACHE_READ_MAX_SIZE:1000}
app.cache.idempotency-max-size=${APP_CACHE_IDEMPOTENCY_MAX_SIZE:5000}
app.cache.redis.enabled=${APP_CACHE_REDIS_ENABLED:false}
app.cache.redis.fallback-to-caffeine-on-error=${APP_CACHE_REDIS_FALLBACK_TO_CAFFEINE_ON_ERROR:true}

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.username=${SPRING_DATA_REDIS_USERNAME:}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${SPRING_DATA_REDIS_SSL_ENABLED:false}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:2s}

# ===============================
# DISTRIBUTED IDEMPOTENCY
# ===============================
app.idempotency.provider=${APP_IDEMPOTENCY_PROVIDER:db}
app.idempotency.ttl-seconds=${APP_IDEMPOTENCY_TTL_SECONDS:300}
app.idempotency.in-progress-wait-millis=${APP_IDEMPOTENCY_IN_PROGRESS_WAIT_MILLIS:2000}
app.idempotency.in-progress-poll-millis=${APP_IDEMPOTENCY_IN_PROGRESS_POLL_MILLIS:50}

# ===============================
# SQL TELEMETRY
# ===============================
app.sql.metrics-enabled=${APP_SQL_METRICS_ENABLED:true}
app.sql.warn-threshold=${APP_SQL_WARN_THRESHOLD:20}

# ===============================
# ACTUATOR + HEALTH
# ===============================
management.health.redis.enabled=false

# ===============================
# EXTERNAL SERVICES
# ===============================
app.customer-service.url=${CUSTOMER_SERVICE_URL:}
app.customer-service.enabled=${CUSTOMER_SERVICE_ENABLED:false}

# SNS event publishing
app.sns.enabled=${SNS_ENABLED:false}
app.sns.booking-created-topic-arn=${BOOKING_CREATED_TOPIC_ARN:}
app.sns.booking-status-updated-topic-arn=${BOOKING_STATUS_UPDATED_TOPIC_ARN:}
app.sns.region=${SNS_REGION:ap-south-1}
