# ============================================================================
# SERVERLESS FRAMEWORK CONFIGURATION
# ============================================================================
# AWS Serverless Architecture:
# - Lambda Functions
# - API Gateway (HTTP API v2)
# - CloudFront (CDN)
# - RDS PostgreSQL
# - Cognito (Authentication)
# ============================================================================

service: warmpawz-api

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: ${opt:region, 'ap-south-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 30
  
  # Environment variables
  environment:
    NODE_ENV: ${self:provider.stage}
    
    # RDS Configuration
    DB_HOST: ${ssm:/warmpawz/${self:provider.stage}/db/host}
    DB_PORT: ${ssm:/warmpawz/${self:provider.stage}/db/port, '5432'}
    DB_NAME: ${ssm:/warmpawz/${self:provider.stage}/db/name}
    DB_USER: ${ssm:/warmpawz/${self:provider.stage}/db/user}
    DB_PASSWORD: ${ssm:/warmpawz/${self:provider.stage}/db/password}
    
    # Cognito Configuration
    COGNITO_USER_POOL_ID: ${ssm:/warmpawz/${self:provider.stage}/cognito/userPoolId}
    COGNITO_CLIENT_ID: ${ssm:/warmpawz/${self:provider.stage}/cognito/clientId}
    COGNITO_REGION: ${self:provider.region}
    
    # SNS Configuration
    SNS_SMS_TOPIC_ARN: ${ssm:/warmpawz/${self:provider.stage}/sns/smsTopicArn}
    
    # Razorpay Configuration
    RAZORPAY_KEY_ID: ${ssm:/warmpawz/${self:provider.stage}/razorpay/keyId}
    RAZORPAY_KEY_SECRET: ${ssm:/warmpawz/${self:provider.stage}/razorpay/keySecret}
    RAZORPAY_WEBHOOK_SECRET: ${ssm:/warmpawz/${self:provider.stage}/razorpay/webhookSecret}
    
    # Feature Flags
    UAT_MODE: ${ssm:/warmpawz/${self:provider.stage}/features/uatMode, 'false'}
    
    # S3 Configuration
    S3_UPLOADS_BUCKET: ${ssm:/warmpawz/${self:provider.stage}/s3/uploadsBucket, 'warmpawz-dev-uploads'}
    S3_STORAGE_BUCKET: ${ssm:/warmpawz/${self:provider.stage}/s3/storageBucket, 'warmpawz-dev-storage'}
    S3_ASSETS_BUCKET: ${ssm:/warmpawz/${self:provider.stage}/s3/assetsBucket, 'warmpawz-dev-assets'}
  
  # IAM Role Permissions
  iam:
    role:
      statements:
        # RDS Access
        - Effect: Allow
          Action:
            - rds-db:connect
          Resource: 
            - arn:aws:rds-db:${self:provider.region}:*:dbuser:*/warmpawz_*
        
        # Cognito Access
        - Effect: Allow
          Action:
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminSetUserPassword
            - cognito-idp:AdminInitiateAuth
            - cognito-idp:AdminGetUser
          Resource:
            - arn:aws:cognito-idp:${self:provider.region}:*:userpool/${ssm:/warmpawz/${self:provider.stage}/cognito/userPoolId}
        
        # SNS Access
        - Effect: Allow
          Action:
            - sns:Publish
          Resource:
            - ${ssm:/warmpawz/${self:provider.stage}/sns/smsTopicArn}
        
        # Secrets Manager Access
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
            - secretsmanager:PutSecretValue
            - secretsmanager:CreateSecret
            - secretsmanager:DescribeSecret
          Resource:
            - arn:aws:secretsmanager:${self:provider.region}:*:secret:warmpawz/${self:provider.stage}/*
        
        # CloudWatch Logs
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: '*'
        
        # S3 Access for file uploads
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
            - s3:ListBucket
          Resource:
            - arn:aws:s3:::warmpawz-*
            - arn:aws:s3:::warmpawz-*/*
        
        # AWS Bedrock Access (for AI plan generation)
        - Effect: Allow
          Action:
            - bedrock:InvokeModel
            - bedrock:InvokeModelWithResponseStream
          Resource:
            - arn:aws:bedrock:${self:provider.region}::foundation-model/*
        
        # AWS Chime SDK Access (for video calls/tele-consultations)
        - Effect: Allow
          Action:
            - chime:CreateMeeting
            - chime:DeleteMeeting
            - chime:GetMeeting
            - chime:ListMeetings
            - chime:CreateAttendee
            - chime:DeleteAttendee
            - chime:GetAttendee
            - chime:ListAttendees
            - chime:BatchCreateAttendee
            - chime:StartMeetingTranscription
            - chime:StopMeetingTranscription
          Resource:
            - arn:aws:chime:*:*:meeting/*
        
        # Chime SDK Meetings specific permissions
        - Effect: Allow
          Action:
            - chime:CreateMeetingWithAttendees
          Resource: '*'
  
  # VPC Configuration for RDS
  vpc:
    securityGroupIds:
      - ${ssm:/warmpawz/${self:provider.stage}/vpc/securityGroupId}
    subnetIds:
      - ${ssm:/warmpawz/${self:provider.stage}/vpc/subnetId1}
      - ${ssm:/warmpawz/${self:provider.stage}/vpc/subnetId2}
  
  # API Gateway Configuration
  # Using existing API Gateway (z0b3obweb6) that frontend is pointing to
  # Note: CORS is handled by Lambda handler to ensure proper OPTIONS handling
  # The Lambda handler handles OPTIONS requests and returns 200 OK for preflight
  # CORS configuration removed from here because:
  # 1. Serverless Framework cannot configure CORS on externally configured HTTP APIs
  # 2. CORS is fully handled in the Lambda handler code (see handler/index.ts)
  httpApi:
    id: z0b3obweb6  # Use existing API Gateway that frontend is pointing to

functions:
  api:
    handler: dist/handler.handler
    description: Warmpawz API Gateway Handler
    events:
      - httpApi:
          path: /{proxy+}
          method: ANY
      - httpApi:
          path: /
          method: ANY

# CloudFront Distribution (disabled for now)
# plugins:
#   - serverless-cloudfront-invalidate

# custom:
#   cloudfront:
#     distributionId: ${ssm:/warmpawz/${self:provider.stage}/cloudfront/distributionId}
#     paths:
#       - '/*'

# Package Configuration
# Include all node_modules (dependencies will be automatically included)
# Exclude only source files and build configs
package:
  patterns:
    - '!src/**'
    - '!*.ts'
    - '!*.tsx'
    - '!tsconfig.json'
    - '!esbuild.config.js'
    - 'dist/**'
    - 'node_modules/**'

