# ============================================================================
# SERVERLESS FRAMEWORK CONFIGURATION
# ============================================================================
# AWS Serverless Architecture:
# - Lambda Functions
# - API Gateway (HTTP API v2)
# - CloudFront (CDN)
# - RDS PostgreSQL
# - Cognito (Authentication)
# ============================================================================

service: warmpawz-api

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: ${opt:region, 'ap-south-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 30
  
  # Environment variables
  environment:
    NODE_ENV: ${self:provider.stage}
    WPZ_API_STAGE: ${self:provider.stage}
    
    # RDS Configuration
    DB_HOST: ${ssm:/warmpawz/${self:provider.stage}/db/host}
    DB_PORT: ${ssm:/warmpawz/${self:provider.stage}/db/port, '5432'}
    DB_NAME: ${ssm:/warmpawz/${self:provider.stage}/db/name}
    DB_USER: ${ssm:/warmpawz/${self:provider.stage}/db/user}
    DB_PASSWORD: ${ssm:/warmpawz/${self:provider.stage}/db/password}
    
    # Cognito Configuration
    COGNITO_USER_POOL_ID: ${ssm:/warmpawz/${self:provider.stage}/cognito/userPoolId}
    COGNITO_CLIENT_ID: ${ssm:/warmpawz/${self:provider.stage}/cognito/clientId}
    COGNITO_REGION: ${self:provider.region}
    
    # SNS Configuration
    SNS_SMS_TOPIC_ARN: ${ssm:/warmpawz/${self:provider.stage}/sns/smsTopicArn}
    
    # Razorpay Configuration
    RAZORPAY_KEY_ID: ${ssm:/warmpawz/${self:provider.stage}/razorpay/keyId}
    RAZORPAY_KEY_SECRET: ${ssm:/warmpawz/${self:provider.stage}/razorpay/keySecret}
    RAZORPAY_WEBHOOK_SECRET: ${ssm:/warmpawz/${self:provider.stage}/razorpay/webhookSecret}
    
    # Feature Flags
    UAT_MODE: ${ssm:/warmpawz/${self:provider.stage}/features/uatMode, 'false'}
    PLATFORM_TAX_DOCUMENTS_ENABLED: ${ssm:/warmpawz/${self:provider.stage}/features/platformTaxDocumentsEnabled, 'true'}

    # Java customer-service: when CUSTOMER_SERVICE_ENABLED=true and URL is set, GET /customer/by-phone uses it first.
    CUSTOMER_SERVICE_URL: ${env:CUSTOMER_SERVICE_URL, ''}
    CUSTOMER_SERVICE_ENABLED: ${env:CUSTOMER_SERVICE_ENABLED, 'false'}
    CUSTOMER_SERVICE_API_KEY: ${env:CUSTOMER_SERVICE_API_KEY, ''}

    # EventBridge — must match a bus that has a rule: source app.warmpawz, detail-type ActionOccurred → loyalty SQS.
    # Dev: custom bus warmpawz-dev-events + route-actionoccurred-to-loyalty-queue-dev → loyalty-events-queue.
    # Prod: default bus + action-occurred-rule → loyalty-events-prod-queue.
    EVENT_BUS_NAME: ${self:custom.eventBridgeActionOccurredBus.${self:provider.stage}}

    # Daily settlement cron rule on default bus (Admin → Finance → Schedule Settings saves PutRule).
    SETTLEMENT_CALCULATE_CRON_RULE_NAME: warmpawz-${self:provider.stage}-settlement-calculate-daily
    
    # S3 Configuration
    S3_UPLOADS_BUCKET: ${ssm:/warmpawz/${self:provider.stage}/s3/uploadsBucket, 'warmpawz-dev-uploads'}
    S3_STORAGE_BUCKET: ${ssm:/warmpawz/${self:provider.stage}/s3/storageBucket, 'warmpawz-dev-storage'}
    S3_ASSETS_BUCKET: ${ssm:/warmpawz/${self:provider.stage}/s3/assetsBucket, 'warmpawz-dev-assets'}
  
  # IAM Role Permissions
  iam:
    role:
      statements:
        # RDS Access
        - Effect: Allow
          Action:
            - rds-db:connect
          Resource: 
            - arn:aws:rds-db:${self:provider.region}:*:dbuser:*/warmpawz_*
        
        # Cognito Access
        - Effect: Allow
          Action:
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminSetUserPassword
            - cognito-idp:AdminInitiateAuth
            - cognito-idp:AdminGetUser
          Resource:
            - arn:aws:cognito-idp:${self:provider.region}:*:userpool/${ssm:/warmpawz/${self:provider.stage}/cognito/userPoolId}
        
        # SNS Access
        - Effect: Allow
          Action:
            - sns:Publish
          Resource:
            - ${ssm:/warmpawz/${self:provider.stage}/sns/smsTopicArn}
        
        # Secrets Manager Access
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
            - secretsmanager:PutSecretValue
            - secretsmanager:CreateSecret
            - secretsmanager:DescribeSecret
          Resource:
            - arn:aws:secretsmanager:${self:provider.region}:*:secret:warmpawz/${self:provider.stage}/*
        
        # CloudWatch Logs
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: '*'

        # EventBridge — action-source-middleware + loyalty-action-publisher (ActionOccurred).
        # Resource list is stage-specific (dev needs custom bus + optional default; prod default only).
        - Effect: Allow
          Action:
            - events:PutEvents
          Resource: ${self:custom.eventBridgePutEventsResources.${self:provider.stage}}

        # EventBridge — admin can update daily settlement cron (PutRule on default bus rule).
        - Effect: Allow
          Action:
            - events:PutRule
            - events:DescribeRule
          Resource:
            - arn:aws:events:${self:provider.region}:*:rule/warmpawz-${self:provider.stage}-settlement-calculate-daily
        
        # S3 Access for file uploads
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
            - s3:ListBucket
          Resource:
            - arn:aws:s3:::warmpawz-*
            - arn:aws:s3:::warmpawz-*/*
        
        # AWS Bedrock Access (for AI plan generation)
        - Effect: Allow
          Action:
            - bedrock:InvokeModel
            - bedrock:InvokeModelWithResponseStream
          Resource:
            - arn:aws:bedrock:${self:provider.region}::foundation-model/*
        
        # AWS Chime SDK Access (for video calls/tele-consultations)
        - Effect: Allow
          Action:
            - chime:CreateMeeting
            - chime:DeleteMeeting
            - chime:GetMeeting
            - chime:ListMeetings
            - chime:CreateAttendee
            - chime:DeleteAttendee
            - chime:GetAttendee
            - chime:ListAttendees
            - chime:BatchCreateAttendee
            - chime:StartMeetingTranscription
            - chime:StopMeetingTranscription
          Resource:
            - arn:aws:chime:*:*:meeting/*
        
        # Chime SDK Meetings specific permissions
        - Effect: Allow
          Action:
            - chime:CreateMeetingWithAttendees
          Resource: '*'
  
  # VPC Configuration for RDS
  vpc:
    securityGroupIds:
      - ${ssm:/warmpawz/${self:provider.stage}/vpc/securityGroupId}
    subnetIds:
      - ${ssm:/warmpawz/${self:provider.stage}/vpc/subnetId1}
      - ${ssm:/warmpawz/${self:provider.stage}/vpc/subnetId2}
  
  # API Gateway Configuration
  # Using existing API Gateway based on stage:
  # - dev: z0b3obweb6
  # - prod: mss9sa4y01
  # Note: CORS is handled by Lambda handler to ensure proper OPTIONS handling
  # The Lambda handler handles OPTIONS requests and returns 200 OK for preflight
  # CORS configuration removed from here because:
  # 1. Serverless Framework cannot configure CORS on externally configured HTTP APIs
  # 2. CORS is fully handled in the Lambda handler code (see handler/index.ts)
  httpApi:
    id: ${self:custom.apiGatewayId.${self:provider.stage}, 'z0b3obweb6'}  # Use stage-specific API Gateway

custom:
  apiGatewayId:
    dev: z0b3obweb6
    prod: mss9sa4y01
  # Loyalty pipeline buses (must match EventBridge rules → SQS → warmpawz-*-loyalty-events-consumer).
  eventBridgeActionOccurredBus:
    dev: warmpawz-dev-events
    prod: default
  eventBridgePutEventsResources:
    dev:
      - arn:aws:events:${self:provider.region}:*:event-bus/default
      - arn:aws:events:${self:provider.region}:*:event-bus/warmpawz-dev-events
    prod:
      - arn:aws:events:${self:provider.region}:*:event-bus/default

functions:
  api:
    handler: dist/handler.handler
    description: Warmpawz API Gateway Handler
    events:
      - httpApi:
          path: /{proxy+}
          method: ANY
      - httpApi:
          path: /
          method: ANY

# CloudFront Distribution (disabled for now)
# plugins:
#   - serverless-cloudfront-invalidate

# custom:
#   cloudfront:
#     distributionId: ${ssm:/warmpawz/${self:provider.stage}/cloudfront/distributionId}
#     paths:
#       - '/*'

# Package Configuration
# Include all node_modules (dependencies will be automatically included)
# Exclude only source files and build configs
package:
  patterns:
    - '!src/**'
    - '!*.ts'
    - '!*.tsx'
    - '!tsconfig.json'
    - '!esbuild.config.js'
    - 'dist/**'
    - 'node_modules/**'

