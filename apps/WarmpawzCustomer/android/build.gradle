buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 21
        // compileSdkVersion 34 (not 35): AGP 8.1.1 + JDK 21 fails to transform
        // android-35 core-for-system-modules.jar via jlink (JdkImageTransform).
        // Bumping compileSdk to 35 also requires AGP 8.6+. Stay on 34 until
        // a coordinated AGP/JDK upgrade.
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "25.1.8937393"
        kotlinVersion = "1.8.0"
    }
    repositories {
        google()
        // Razorpay Maven repository (MUST be before mavenCentral - Razorpay doesn't publish to Maven Central)
        maven { url "https://maven.razorpay.com/releases" }
        mavenCentral()
        // Fallback repositories for CI/CD (Maven Central 403 issues)
        maven { url 'https://maven.google.com' }
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Configure repositories for all subprojects (CI/CD compatibility)
allprojects {
    repositories {
        // Order matters: Google first (most React Native deps), then Razorpay, then Maven Central with fallbacks
        google()
        // Razorpay Maven repository (MUST be before mavenCentral - Razorpay doesn't publish to Maven Central)
        maven { url "https://maven.razorpay.com/releases" }
        mavenCentral()
        // Fallback for CI/CD when Maven Central returns 403
        maven { url 'https://maven.google.com' }
        maven { url 'https://jitpack.io' }
        maven { url 'https://repo.maven.apache.org/maven2' }
    }
}

// Force compatible versions to prevent CI/CD resolution errors
subprojects {
    configurations.all {
        resolutionStrategy {
            // AndroidX core compatibility for compileSdk 34 and AGP 8.1.1
            force 'androidx.core:core:1.13.1'
            force 'androidx.core:core-ktx:1.13.1'

            // Force soloader version (prevents Maven Central 403 issues in CI)
            force 'com.facebook.soloader:soloader:0.10.5'

            // NOTE: Do NOT force 'com.facebook.fresco:fresco' here. React Native
            // 0.73's `react-android` AAR is compiled against Fresco 3.x and
            // calls `ControllerListener2$Extras.obtainExtras(...PointF...Uri)`
            // — an overload that does not exist in Fresco 2.5.0. Pinning Fresco
            // to 2.5.0 makes the first <Image> mount throw NoSuchMethodError
            // and crashes the app on the home / auth screen. Let Gradle pick
            // whatever Fresco version RN 0.73 ships with.
        }
    }
}
