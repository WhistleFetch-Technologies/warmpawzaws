name: 🚀 Deploy to Development

on:
  push:
    branches:
      - develop
  workflow_dispatch:

# Prevent parallel deployments to the same environment
concurrency:
  group: dev-deployment
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1
  TERRAFORM_VERSION: 1.6.0
  NODE_VERSION: 22
  JAVA_VERSION: 17

jobs:
  # ============================================
  # STATIC ANALYSIS
  # ============================================
  static-analysis:
    name: 🔍 Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run linter
        run: npm run lint || echo "Lint script not found, skipping..."
        continue-on-error: true

      - name: Run type check
        run: npm run type-check || echo "Type-check script not found, skipping..."
        continue-on-error: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Validate Terraform
        working-directory: infra/envs/dev
        run: |
          terraform init -backend=false
          terraform validate

  # ============================================
  # BUILD BACKEND
  # ============================================
  build-backend:
    name: 🔨 Build Backend
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Lambda handlers
        working-directory: backend/lambda
        run: |
          npm ci
          npm run build
          ls -lh api-handler.zip  # Verify ZIP was created

      - name: Upload Lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-handlers
          path: backend/lambda/api-handler.zip
          retention-days: 1
          if-no-files-found: error

  # ============================================
  # BUILD FRONTEND APPS
  # ============================================
  build-frontend:
    name: 🎨 Build Frontend Apps
    runs-on: ubuntu-latest
    needs: static-analysis
    strategy:
      matrix:
        app: [admin-web, vendor-web, customer-web]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: npm ci --legacy-peer-deps

      - name: Build ${{ matrix.app }}
        working-directory: apps/${{ matrix.app }}
        run: npm run build
        env:
          VITE_API_URL: https://dev.api.warmpawz.com
          VITE_COGNITO_USER_POOL_ID: ${{ secrets.DEV_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ secrets.DEV_COGNITO_CLIENT_ID }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ matrix.app }}
          path: apps/${{ matrix.app }}/dist
          retention-days: 1

  # ============================================
  # BUILD MOBILE APPS
  # ============================================
  build-mobile-android:
    name: 📱 Build Android Apps
    runs-on: ubuntu-latest
    needs: static-analysis
    strategy:
      matrix:
        app: [WarmpawzCustomer, WarmpawzVendor]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: npm ci --legacy-peer-deps

      - name: Create environment config
        working-directory: apps/${{ matrix.app }}
        run: |
          cat > .env << EOF
          API_BASE_URL=https://dev.api.warmpawz.com
          GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
          RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
          ENVIRONMENT=dev
          EOF

      - name: Build Android APK
        working-directory: apps/${{ matrix.app }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDevRelease --no-daemon
          
      - name: List build outputs (debug)
        working-directory: apps/${{ matrix.app }}/android
        run: |
          echo "Build outputs:"
          find app/build/outputs/apk -name "*.apk" -type f

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.app }}
          path: apps/${{ matrix.app }}/android/app/build/outputs/apk/dev/release/*.apk
          retention-days: 7
          if-no-files-found: error

  # ============================================
  # TERRAFORM PLAN
  # ============================================
  terraform-plan:
    name: 📋 Terraform Plan
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Download Lambda artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-handlers
          path: backend/lambda

      - name: Bootstrap Terraform Backend (if needed)
        working-directory: infra/bootstrap
        continue-on-error: true
        run: |
          echo "🔍 Checking if Terraform backend exists..."
          if ! aws s3 ls s3://warmpawz-terraform-state-${{ secrets.AWS_ACCOUNT_ID }} 2>/dev/null; then
            echo "📦 Backend not found, bootstrapping..."
            terraform init
            terraform apply -auto-approve
            echo "✅ Backend bootstrapped successfully"
          else
            echo "✅ Backend already exists, skipping bootstrap"
          fi

      - name: Clear DynamoDB state entries (PREVENTS CORRUPTION)
        continue-on-error: true
        timeout-minutes: 1
        run: |
          echo "🧹 CRITICAL: Clearing ALL DynamoDB state entries to prevent corruption..."
          echo ""
          
          # IMPORTANT: DynamoDB stores TWO types of entries:
          # 1. Lock entry: path/terraform.tfstate
          # 2. Checksum entry: path/terraform.tfstate-md5
          # 
          # The checksum entry (-md5) causes "does not have the expected content" error
          # We MUST delete BOTH before terraform init
          
          STATE_PATH="warmpawz-terraform-state-${{ secrets.AWS_ACCOUNT_ID }}/dev/terraform.tfstate"
          
          echo "1. Deleting lock entry: ${STATE_PATH}"
          aws dynamodb delete-item \
            --table-name warmpawz-terraform-locks \
            --key "{\"LockID\":{\"S\":\"${STATE_PATH}\"}}" \
            --region ap-south-1 2>&1 || echo "   No lock entry found (OK)"
          
          echo "2. Deleting checksum entry: ${STATE_PATH}-md5"
          aws dynamodb delete-item \
            --table-name warmpawz-terraform-locks \
            --key "{\"LockID\":{\"S\":\"${STATE_PATH}-md5\"}}" \
            --region ap-south-1 2>&1 || echo "   No checksum entry found (OK)"
          
          echo ""
          echo "3. Verifying DynamoDB is clean..."
          REMAINING=$(aws dynamodb scan --table-name warmpawz-terraform-locks --region ap-south-1 --query 'Count' --output text 2>/dev/null || echo "0")
          echo "   Remaining entries: ${REMAINING}"
          
          if [ "$REMAINING" = "0" ]; then
            echo "✅ DynamoDB is clean - no corruption possible"
          else
            echo "⚠️  Some entries remain (may be from other environments)"
          fi

      - name: Terraform Init
        working-directory: infra/envs/dev
        run: terraform init -backend-config=backend.hcl

      - name: Force unlock stale Terraform state (ROBUST)
        continue-on-error: true
        timeout-minutes: 1
        run: |
          echo "🔓 CRITICAL: Checking and clearing ANY existing Terraform state locks..."
          
          # Method 1: Direct DynamoDB deletion (most reliable)
          echo "Method 1: Direct DynamoDB lock removal"
          aws dynamodb delete-item \
            --table-name warmpawz-terraform-locks \
            --key '{"LockID":{"S":"warmpawz-terraform-state-${{ secrets.AWS_ACCOUNT_ID }}/dev/terraform.tfstate"}}' \
            --region ap-south-1 2>&1 || echo "  No lock found in DynamoDB (this is OK)"
          
          # Method 2: Terraform force-unlock (backup method)
          echo ""
          echo "Method 2: Terraform force-unlock (if lock still exists)"
          cd infra/envs/dev
          
          # Get the lock info and extract UUID
          LOCK_INFO=$(aws dynamodb get-item \
            --table-name warmpawz-terraform-locks \
            --key '{"LockID":{"S":"warmpawz-terraform-state-${{ secrets.AWS_ACCOUNT_ID }}/dev/terraform.tfstate"}}' \
            --region ap-south-1 \
            --query 'Item.Info.S' \
            --output text 2>/dev/null || echo "")
          
          if [ -n "$LOCK_INFO" ] && [ "$LOCK_INFO" != "None" ]; then
            LOCK_UUID=$(echo "$LOCK_INFO" | jq -r '.ID' 2>/dev/null || echo "")
            if [ -n "$LOCK_UUID" ] && [ "$LOCK_UUID" != "null" ] && [ "$LOCK_UUID" != "" ]; then
              echo "  Found lock UUID: $LOCK_UUID"
              echo "  Force unlocking via Terraform..."
              terraform force-unlock -force "$LOCK_UUID" 2>&1 || echo "  Terraform unlock failed (may not be needed)"
            fi
          else
            echo "  No lock info found (state is clean)"
          fi
          
          echo ""
          echo "✅ State lock cleanup complete - ready for deployment"

      - name: Delete orphaned AWS resources (CLEAN SLATE)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          echo "🧹 DELETING ORPHANED AWS RESOURCES FOR CLEAN TERRAFORM STATE..."
          echo "These resources exist in AWS but not in Terraform state"
          echo ""
          
          echo "═══════════════════════════════════════════════════════════════"
          echo "1️⃣  CLOUDWATCH LOG GROUPS"
          echo "═══════════════════════════════════════════════════════════════"
          aws logs delete-log-group --log-group-name "/aws/apigateway/warmpawz-dev" --region ap-south-1 2>&1 || echo "  Not found or already deleted"
          aws logs delete-log-group --log-group-name "/aws/lambda/warmpawz-dev-api-handler" --region ap-south-1 2>&1 || echo "  Not found or already deleted"
          echo "  ✅ Log groups cleaned"
          
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "2️⃣  CLOUDFRONT OACs - SKIPPED (will be imported instead)"
          echo "═══════════════════════════════════════════════════════════════"
          echo "  ⏭️  OACs cannot be deleted if in use - will import them"
          
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "3️⃣  DYNAMODB TABLES"
          echo "═══════════════════════════════════════════════════════════════"
          for TABLE in sessions analytics-events cache rate-limits; do
            echo "  Deleting table: warmpawz-dev-${TABLE}"
            aws dynamodb delete-table --table-name "warmpawz-dev-${TABLE}" --region ap-south-1 2>&1 || echo "    Not found"
          done
          echo "  ✅ DynamoDB tables cleaned"
          
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "4️⃣  RDS DB SUBNET GROUP - SKIPPED (will be imported instead)"
          echo "═══════════════════════════════════════════════════════════════"
          echo "  ⏭️  Subnet group cannot be deleted if RDS exists - will import it"
          
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "5️⃣  SECRETS MANAGER (schedule deletion)"
          echo "═══════════════════════════════════════════════════════════════"
          for SECRET in "warmpawz/dev/razorpay" "warmpawz/dev/google-maps" "warmpawz/dev/shiprocket"; do
            echo "  Deleting secret: ${SECRET}"
            aws secretsmanager delete-secret --secret-id "$SECRET" --force-delete-without-recovery --region ap-south-1 2>&1 || echo "    Not found"
          done
          # Also delete any RDS master password secrets
          for SECRET_ARN in $(aws secretsmanager list-secrets --region ap-south-1 --query "SecretList[?contains(Name, 'warmpawz-dev-rds-master')].ARN" --output text 2>/dev/null); do
            echo "  Deleting RDS secret: ${SECRET_ARN}"
            aws secretsmanager delete-secret --secret-id "$SECRET_ARN" --force-delete-without-recovery --region ap-south-1 2>&1 || echo "    Failed"
          done
          echo "  ✅ Secrets cleaned"
          
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "6️⃣  S3 BUCKETS (empty and delete)"
          echo "═══════════════════════════════════════════════════════════════"
          BUCKETS=(
            "warmpawz-dev-admin-frontend-ap-south-1"
            "warmpawz-dev-vendor-frontend-ap-south-1"
            "warmpawz-dev-customer-frontend-ap-south-1"
            "warmpawz-dev-user-uploads-${{ secrets.AWS_ACCOUNT_ID }}"
            "warmpawz-dev-static-${{ secrets.AWS_ACCOUNT_ID }}"
            "warmpawz-dev-logs-${{ secrets.AWS_ACCOUNT_ID }}"
            "warmpawz-dev-backups-${{ secrets.AWS_ACCOUNT_ID }}"
          )
          for BUCKET in "${BUCKETS[@]}"; do
            echo "  Processing bucket: ${BUCKET}"
            # Check if bucket exists
            if aws s3api head-bucket --bucket "$BUCKET" --region ap-south-1 2>/dev/null; then
              # Empty the bucket first
              aws s3 rm "s3://${BUCKET}" --recursive --region ap-south-1 2>&1 || echo "    Empty failed"
              # Delete bucket versioning objects if any
              aws s3api delete-objects --bucket "$BUCKET" --delete "$(aws s3api list-object-versions --bucket "$BUCKET" --query '{Objects: Versions[].{Key:Key,VersionId:VersionId}}' --output json 2>/dev/null || echo '{"Objects":[]}')" --region ap-south-1 2>&1 || echo "    Version delete skipped"
              # Delete the bucket
              aws s3api delete-bucket --bucket "$BUCKET" --region ap-south-1 2>&1 || echo "    Bucket delete failed"
              echo "    ✅ Deleted"
            else
              echo "    Not found"
            fi
          done
          echo "  ✅ S3 buckets cleaned"
          
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "✅ CLEANUP COMPLETE - TERRAFORM WILL CREATE FRESH RESOURCES"
          echo "═══════════════════════════════════════════════════════════════"

      # NUCLEAR OPTION: Delete entire state and start fresh
      # VPC module has lifecycle { ignore_changes = all } so imports will work
      - name: 🔥 DELETE STATE + Import all existing resources
        working-directory: infra/envs/dev
        continue-on-error: true
        timeout-minutes: 8  # Increased from 3 to 8 minutes
        env:
          TF_VAR_opensearch_master_password: ${{ secrets.DEV_OPENSEARCH_PASSWORD }}
          TF_VAR_razorpay_key_id: ${{ secrets.RAZORPAY_KEY_ID }}
          TF_VAR_razorpay_key_secret: ${{ secrets.RAZORPAY_KEY_SECRET }}
          TF_VAR_google_maps_api_key: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          TF_VAR_shiprocket_email: ${{ secrets.SHIPROCKET_EMAIL }}
          TF_VAR_shiprocket_password: ${{ secrets.SHIPROCKET_PASSWORD }}
        run: |
          echo "🔥🔥🔥 NUCLEAR OPTION: DELETING ENTIRE STATE FILE 🔥🔥🔥"
          echo ""
          echo "WHY: State has mixed VPC resources causing destroy loops"
          echo "FIX: Start fresh, import only RDS to preserve database"
          echo "SAFETY: VPC module has lifecycle { ignore_changes = all }"
          echo ""
          
          # Delete state file from S3
          echo "1️⃣ Deleting terraform state from S3..."
          aws s3 rm "s3://warmpawz-terraform-state-057442119249/dev/terraform.tfstate" --region ap-south-1 2>&1 || echo "   State file not found"
          
          # Delete DynamoDB entries
          echo "2️⃣ Clearing DynamoDB entries..."
          aws dynamodb delete-item --table-name warmpawz-terraform-locks \
            --key '{"LockID":{"S":"warmpawz-terraform-state-057442119249/dev/terraform.tfstate"}}' \
            --region ap-south-1 2>&1 || true
          aws dynamodb delete-item --table-name warmpawz-terraform-locks \
            --key '{"LockID":{"S":"warmpawz-terraform-state-057442119249/dev/terraform.tfstate-md5"}}' \
            --region ap-south-1 2>&1 || true
          
          echo ""
          echo "3️⃣ Re-initializing Terraform (fresh state)..."
          rm -rf .terraform .terraform.lock.hcl
          terraform init -backend-config=backend.hcl -reconfigure
          
          echo ""
          echo "4️⃣ Importing ALL existing resources..."
          
          # Find and import EXISTING VPC + Subnets
          echo "   📦 VPC + Subnets (use_existing_vpc = true)..."
          EXISTING_VPC_ID=$(aws ec2 describe-vpcs --filters "Name=tag:Name,Values=warmpawz-dev-vpc" --region ap-south-1 --query 'Vpcs[0].VpcId' --output text 2>/dev/null || echo "")
          if [ -z "$EXISTING_VPC_ID" ] || [ "$EXISTING_VPC_ID" == "None" ]; then
            # Try to find VPC from RDS subnet group
            EXISTING_VPC_ID=$(aws rds describe-db-subnet-groups --db-subnet-group-name warmpawz-dev-db-subnet-group --region ap-south-1 --query 'DBSubnetGroups[0].VpcId' --output text 2>/dev/null || echo "")
          fi
          
          if [ -n "$EXISTING_VPC_ID" ] && [ "$EXISTING_VPC_ID" != "None" ]; then
            echo "      Found existing VPC: $EXISTING_VPC_ID"
            # Note: VPC module uses data source when use_existing_vpc = true, no import needed for VPC itself
            
            # But we MUST import subnets (they conflict if not imported)
            echo "      Importing existing subnets..."
            
            # Public subnets (FIX: Show full output)
            PUBLIC_SUBNETS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$EXISTING_VPC_ID" "Name=tag:Name,Values=*public*" --region ap-south-1 --query 'Subnets | sort_by(@, &AvailabilityZone)[*].SubnetId' --output text 2>/dev/null || echo "")
            IDX=0
            for SUBNET_ID in $PUBLIC_SUBNETS; do
              SUBNET_OUTPUT=$(terraform import -input=false -lock=false "module.vpc.aws_subnet.public[$IDX]" "$SUBNET_ID" 2>&1)
              echo "$SUBNET_OUTPUT"
              echo "$SUBNET_OUTPUT" | grep -qE "Import successful|already managed" && echo "      ✅ public[$IDX] imported" || echo "      ❌ public[$IDX] FAILED: $SUBNET_OUTPUT"
              IDX=$((IDX + 1))
            done
            
            # Private subnets (FIX: Show full output)
            PRIVATE_SUBNETS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$EXISTING_VPC_ID" "Name=tag:Name,Values=*private*" --region ap-south-1 --query 'Subnets | sort_by(@, &AvailabilityZone)[*].SubnetId' --output text 2>/dev/null || echo "")
            IDX=0
            for SUBNET_ID in $PRIVATE_SUBNETS; do
              SUBNET_OUTPUT=$(terraform import -input=false -lock=false "module.vpc.aws_subnet.private[$IDX]" "$SUBNET_ID" 2>&1)
              echo "$SUBNET_OUTPUT"
              echo "$SUBNET_OUTPUT" | grep -qE "Import successful|already managed" && echo "      ✅ private[$IDX] imported" || echo "      ❌ private[$IDX] FAILED: $SUBNET_OUTPUT"
              IDX=$((IDX + 1))
            done
            
            # Database subnets (FIX: Show full output)
            DATABASE_SUBNETS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$EXISTING_VPC_ID" "Name=tag:Name,Values=*database*" --region ap-south-1 --query 'Subnets | sort_by(@, &AvailabilityZone)[*].SubnetId' --output text 2>/dev/null || echo "")
            IDX=0
            for SUBNET_ID in $DATABASE_SUBNETS; do
              SUBNET_OUTPUT=$(terraform import -input=false -lock=false "module.vpc.aws_subnet.database[$IDX]" "$SUBNET_ID" 2>&1)
              echo "$SUBNET_OUTPUT"
              echo "$SUBNET_OUTPUT" | grep -qE "Import successful|already managed" && echo "      ✅ database[$IDX] imported" || echo "      ❌ database[$IDX] FAILED: $SUBNET_OUTPUT"
              IDX=$((IDX + 1))
            done
            
            echo "      ✅ VPC and subnets imported"
          else
            echo "      ⚠️ No existing VPC found - this may cause issues!"
          fi
          
          # Import CloudFront OACs
          echo "   📦 CloudFront OACs..."
          for APP in admin vendor customer; do
            OAC_ID=$(aws cloudfront list-origin-access-controls --query "OriginAccessControlList.Items[?Name=='warmpawz-dev-${APP}-oac'].Id" --output text 2>/dev/null || echo "")
            if [ -n "$OAC_ID" ] && [ "$OAC_ID" != "None" ] && [ "$OAC_ID" != "" ]; then
              echo "      Importing warmpawz-dev-${APP}-oac: $OAC_ID"
              terraform import -input=false -lock=false "module.cloudfront.aws_cloudfront_origin_access_control.frontend[\"${APP}\"]" "$OAC_ID" 2>&1 | grep -E "Import successful|already managed" || echo "      ⚠️ Skipped"
            fi
          done
          
          # Import RDS DB Subnet Group
          echo "   📦 RDS DB Subnet Group..."
          if aws rds describe-db-subnet-groups --db-subnet-group-name warmpawz-dev-db-subnet-group --region ap-south-1 2>/dev/null | grep -q "warmpawz-dev-db-subnet-group"; then
            terraform import -input=false -lock=false 'module.rds.aws_db_subnet_group.main' warmpawz-dev-db-subnet-group 2>&1 | grep -E "Import successful|already managed" || echo "      ⚠️ Skipped"
          fi
          
          # Import RDS Security Group
          echo "   📦 RDS Security Group..."
          RDS_SG_ID=$(aws ec2 describe-security-groups --filters "Name=group-name,Values=warmpawz-dev-rds-*" --region ap-south-1 --query 'SecurityGroups[0].GroupId' --output text 2>/dev/null || echo "")
          if [ -n "$RDS_SG_ID" ] && [ "$RDS_SG_ID" != "None" ]; then
            terraform import -input=false -lock=false 'module.rds.aws_security_group.rds' "$RDS_SG_ID" 2>&1 | grep -E "Import successful|already managed" || echo "      ⚠️ Skipped"
          fi
          
          # Import RDS Parameter Groups (FIX: Get FIRST match only, add awk to handle tabs/spaces)
          echo "   📦 RDS Parameter Groups..."
          CLUSTER_PG=$(aws rds describe-db-cluster-parameter-groups --region ap-south-1 --query "DBClusterParameterGroups[?contains(DBClusterParameterGroupName, 'warmpawz-dev-aurora')].DBClusterParameterGroupName | [0]" --output text 2>/dev/null | awk '{print $1}')
          if [ -n "$CLUSTER_PG" ] && [ "$CLUSTER_PG" != "None" ]; then
            echo "      Importing: $CLUSTER_PG"
            terraform import -input=false -lock=false 'module.rds.aws_rds_cluster_parameter_group.main' "$CLUSTER_PG" 2>&1 | grep -E "Import successful|already managed" || echo "      ⚠️ Skipped"
          fi
          
          DB_PG=$(aws rds describe-db-parameter-groups --region ap-south-1 --query "DBParameterGroups[?contains(DBParameterGroupName, 'warmpawz-dev-aurora-db')].DBParameterGroupName | [0]" --output text 2>/dev/null | awk '{print $1}')
          if [ -n "$DB_PG" ] && [ "$DB_PG" != "None" ]; then
            echo "      Importing: $DB_PG"
            terraform import -input=false -lock=false 'module.rds.aws_db_parameter_group.main' "$DB_PG" 2>&1 | grep -E "Import successful|already managed" || echo "      ⚠️ Skipped"
          fi
          
          # Import RDS cluster if exists
          echo "   📦 RDS Cluster + Instance..."
          if aws rds describe-db-clusters --db-cluster-identifier warmpawz-dev-cluster --region ap-south-1 2>/dev/null | grep -q "warmpawz-dev-cluster"; then
            terraform import -input=false -lock=false 'module.rds.aws_rds_cluster.main' warmpawz-dev-cluster 2>&1 | grep -E "Import successful|already managed" || echo "      ⚠️ Skipped"
            
            INSTANCE_ID=$(aws rds describe-db-instances --region ap-south-1 --query "DBInstances[?DBClusterIdentifier=='warmpawz-dev-cluster'].DBInstanceIdentifier" --output text 2>/dev/null | head -1)
            if [ -n "$INSTANCE_ID" ] && [ "$INSTANCE_ID" != "None" ]; then
              terraform import -input=false -lock=false 'module.rds.aws_rds_cluster_instance.main[0]' "$INSTANCE_ID" 2>&1 | grep -E "Import successful|already managed" || echo "      ⚠️ Skipped"
            fi
          fi
          
          # Import RDS Secret
          echo "   📦 RDS Secret..."
          SECRET_ARN=$(aws secretsmanager list-secrets --region ap-south-1 --query "SecretList[?starts_with(Name, 'warmpawz-dev-rds-master')].ARN" --output text 2>/dev/null | head -1)
          if [ -n "$SECRET_ARN" ] && [ "$SECRET_ARN" != "None" ]; then
            terraform import -input=false -lock=false 'module.rds.aws_secretsmanager_secret.rds_master_password' "$SECRET_ARN" 2>&1 | grep -E "Import successful|already managed" || echo "      ⚠️ Skipped"
          fi
          
          # Import Lambda Function + Permission + Alias
          echo "   📦 Lambda Function + Permission + Alias..."
          if aws lambda get-function --function-name warmpawz-dev-api-handler --region ap-south-1 2>/dev/null | grep -q "warmpawz-dev-api-handler"; then
            # Import Lambda function (FIX: Show full output)
            terraform state rm 'module.lambda.aws_lambda_function.functions["api-handler"]' 2>&1 | grep -v "Invalid target address" || true
            FUNC_OUTPUT=$(terraform import -input=false -lock=false 'module.lambda.aws_lambda_function.functions["api-handler"]' warmpawz-dev-api-handler 2>&1)
            echo "$FUNC_OUTPUT"
            echo "$FUNC_OUTPUT" | grep -qE "Import successful|already managed" && echo "      ✅ Function imported" || echo "      ❌ Function import FAILED: $FUNC_OUTPUT"
            
            # Import Lambda permission (format: function_name/statement_id)
            terraform state rm 'module.api_gateway.aws_lambda_permission.api_gateway["api-handler"]' 2>&1 | grep -v "Invalid target address" || true
            PERM_OUTPUT=$(terraform import -input=false -lock=false 'module.api_gateway.aws_lambda_permission.api_gateway["api-handler"]' warmpawz-dev-api-handler/AllowAPIGatewayInvoke-api-handler 2>&1)
            echo "$PERM_OUTPUT"
            echo "$PERM_OUTPUT" | grep -qE "Import successful|already managed" && echo "      ✅ Permission imported" || echo "      ❌ Permission import FAILED: $PERM_OUTPUT"
            
            # Import Lambda alias (FIX: Must import AFTER function is imported)
            terraform state rm 'module.lambda.aws_lambda_alias.live["api-handler"]' 2>&1 | grep -v "Invalid target address" || true
            ALIAS_OUTPUT=$(terraform import -input=false -lock=false 'module.lambda.aws_lambda_alias.live["api-handler"]' warmpawz-dev-api-handler:live 2>&1)
            echo "$ALIAS_OUTPUT"
            echo "$ALIAS_OUTPUT" | grep -qE "Import successful|already managed" && echo "      ✅ Alias imported" || echo "      ❌ Alias import FAILED: $ALIAS_OUTPUT"
          fi
          
          # Import NAT Gateway + EIP (EIP limit reached - must import existing)
          if [ -n "$EXISTING_VPC_ID" ] && [ "$EXISTING_VPC_ID" != "None" ]; then
            echo "   📦 NAT Gateway + EIP (EIP limit reached)..."
            NAT_GW=$(aws ec2 describe-nat-gateways --filter "Name=vpc-id,Values=$EXISTING_VPC_ID" "Name=state,Values=available" --region ap-south-1 --query 'NatGateways[0].NatGatewayId' --output text 2>/dev/null || echo "")
            if [ -n "$NAT_GW" ] && [ "$NAT_GW" != "None" ]; then
              echo "      Importing NAT Gateway: $NAT_GW"
              terraform state rm 'module.vpc.aws_nat_gateway.main[0]' 2>&1 | grep -v "Invalid target address" || true
              NAT_OUTPUT=$(terraform import -input=false -lock=false 'module.vpc.aws_nat_gateway.main[0]' "$NAT_GW" 2>&1)
              echo "$NAT_OUTPUT"
              echo "$NAT_OUTPUT" | grep -qE "Import successful|already managed" && echo "      ✅ NAT Gateway imported" || echo "      ❌ NAT Gateway import FAILED"
              
              # Import EIP used by NAT Gateway
              EIP_ID=$(aws ec2 describe-nat-gateways --nat-gateway-ids "$NAT_GW" --region ap-south-1 --query 'NatGateways[0].NatGatewayAddresses[0].AllocationId' --output text 2>/dev/null || echo "")
              if [ -n "$EIP_ID" ] && [ "$EIP_ID" != "None" ]; then
                echo "      Importing EIP: $EIP_ID"
                terraform state rm 'module.vpc.aws_eip.nat[0]' 2>&1 | grep -v "Invalid target address" || true
                EIP_OUTPUT=$(terraform import -input=false -lock=false 'module.vpc.aws_eip.nat[0]' "$EIP_ID" 2>&1)
                echo "$EIP_OUTPUT"
                echo "$EIP_OUTPUT" | grep -qE "Import successful|already managed" && echo "      ✅ EIP imported" || echo "      ❌ EIP import FAILED"
              fi
            fi
            
            # Import Internet Gateway
            IGW_ID=$(aws ec2 describe-internet-gateways --filters "Name=attachment.vpc-id,Values=$EXISTING_VPC_ID" --region ap-south-1 --query 'InternetGateways[0].InternetGatewayId' --output text 2>/dev/null || echo "")
            if [ -n "$IGW_ID" ] && [ "$IGW_ID" != "None" ]; then
              echo "      Importing Internet Gateway: $IGW_ID"
              terraform state rm 'module.vpc.aws_internet_gateway.main[0]' 2>&1 | grep -v "Invalid target address" || true
              IGW_OUTPUT=$(terraform import -input=false -lock=false 'module.vpc.aws_internet_gateway.main[0]' "$IGW_ID" 2>&1)
              echo "$IGW_OUTPUT"
              echo "$IGW_OUTPUT" | grep -qE "Import successful|already managed" && echo "      ✅ IGW imported" || echo "      ❌ IGW import FAILED"
            fi
          fi
          
          # Import Route Tables FIRST (then associations)
          if [ -n "$EXISTING_VPC_ID" ] && [ "$EXISTING_VPC_ID" != "None" ]; then
            echo "   📦 Route Tables (import before associations)..."
            
            # Import public route table (FIX: Ignore 'Invalid target address' from state rm)
            PUBLIC_RT=$(aws ec2 describe-route-tables --filters "Name=vpc-id,Values=$EXISTING_VPC_ID" "Name=tag:Name,Values=warmpawz-dev-public-rt" --region ap-south-1 --query 'RouteTables[0].RouteTableId' --output text 2>/dev/null || echo "")
            if [ -n "$PUBLIC_RT" ] && [ "$PUBLIC_RT" != "None" ]; then
              echo "      Importing public route table: $PUBLIC_RT"
              terraform state rm 'module.vpc.aws_route_table.public' 2>&1 | grep -v "Invalid target address" || true
              RT_OUTPUT=$(terraform import -input=false -lock=false 'module.vpc.aws_route_table.public' "$PUBLIC_RT" 2>&1)
              echo "$RT_OUTPUT"
              echo "$RT_OUTPUT" | grep -qE "Import successful|already managed" && echo "      ✅ Public RT imported" || echo "      ❌ Public RT import FAILED: $RT_OUTPUT"
            fi
            
            # Import private route table
            PRIVATE_RT=$(aws ec2 describe-route-tables --filters "Name=vpc-id,Values=$EXISTING_VPC_ID" "Name=tag:Name,Values=warmpawz-dev-private-rt-1" --region ap-south-1 --query 'RouteTables[0].RouteTableId' --output text 2>/dev/null || echo "")
            if [ -n "$PRIVATE_RT" ] && [ "$PRIVATE_RT" != "None" ]; then
              echo "      Importing private route table: $PRIVATE_RT"
              terraform state rm 'module.vpc.aws_route_table.private[0]' 2>&1 | grep -v "Invalid target address" || true
              RT_OUTPUT=$(terraform import -input=false -lock=false 'module.vpc.aws_route_table.private[0]' "$PRIVATE_RT" 2>&1)
              echo "$RT_OUTPUT"
              echo "$RT_OUTPUT" | grep -qE "Import successful|already managed" && echo "      ✅ Private RT imported" || echo "      ❌ Private RT import FAILED: $RT_OUTPUT"
            fi
            
            # Import database route table
            DATABASE_RT=$(aws ec2 describe-route-tables --filters "Name=vpc-id,Values=$EXISTING_VPC_ID" "Name=tag:Name,Values=warmpawz-dev-database-rt" --region ap-south-1 --query 'RouteTables[0].RouteTableId' --output text 2>/dev/null || echo "")
            if [ -n "$DATABASE_RT" ] && [ "$DATABASE_RT" != "None" ]; then
              echo "      Importing database route table: $DATABASE_RT"
              terraform state rm 'module.vpc.aws_route_table.database' 2>&1 | grep -v "Invalid target address" || true
              RT_OUTPUT=$(terraform import -input=false -lock=false 'module.vpc.aws_route_table.database' "$DATABASE_RT" 2>&1)
              echo "$RT_OUTPUT"
              echo "$RT_OUTPUT" | grep -qE "Import successful|already managed" && echo "      ✅ Database RT imported" || echo "      ❌ Database RT import FAILED: $RT_OUTPUT"
            fi
            
            echo "   📦 Route Table Associations..."
            
            # Import public subnet associations (FIX: Ignore 'Invalid target address' from state rm)
            PUBLIC_SUBNETS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$EXISTING_VPC_ID" "Name=tag:Name,Values=*public*" --region ap-south-1 --query 'Subnets | sort_by(@, &AvailabilityZone)[*].SubnetId' --output text 2>/dev/null || echo "")
            IDX=0
            for SUBNET_ID in $PUBLIC_SUBNETS; do
              RT_ASSOC_ID=$(aws ec2 describe-route-tables --filters "Name=association.subnet-id,Values=$SUBNET_ID" --region ap-south-1 --query 'RouteTables[0].Associations[?SubnetId==`'$SUBNET_ID'`].RouteTableAssociationId' --output text 2>/dev/null || echo "")
              if [ -n "$RT_ASSOC_ID" ] && [ "$RT_ASSOC_ID" != "None" ] && [ "$RT_ASSOC_ID" != "" ]; then
                echo "      Importing public[$IDX]: subnet=$SUBNET_ID, assoc=$RT_ASSOC_ID"
                terraform state rm "module.vpc.aws_route_table_association.public[$IDX]" 2>&1 | grep -v "Invalid target address" || true
                ASSOC_OUTPUT=$(terraform import -input=false -lock=false "module.vpc.aws_route_table_association.public[$IDX]" "$RT_ASSOC_ID" 2>&1)
                echo "$ASSOC_OUTPUT"
                echo "$ASSOC_OUTPUT" | grep -qE "Import successful|already managed" && echo "      ✅ public[$IDX] imported" || echo "      ❌ public[$IDX] FAILED: $ASSOC_OUTPUT"
              fi
              IDX=$((IDX + 1))
            done
            
            # Import private subnet associations
            PRIVATE_SUBNETS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$EXISTING_VPC_ID" "Name=tag:Name,Values=*private*" --region ap-south-1 --query 'Subnets | sort_by(@, &AvailabilityZone)[*].SubnetId' --output text 2>/dev/null || echo "")
            IDX=0
            for SUBNET_ID in $PRIVATE_SUBNETS; do
              RT_ASSOC_ID=$(aws ec2 describe-route-tables --filters "Name=association.subnet-id,Values=$SUBNET_ID" --region ap-south-1 --query 'RouteTables[0].Associations[?SubnetId==`'$SUBNET_ID'`].RouteTableAssociationId' --output text 2>/dev/null || echo "")
              if [ -n "$RT_ASSOC_ID" ] && [ "$RT_ASSOC_ID" != "None" ] && [ "$RT_ASSOC_ID" != "" ]; then
                echo "      Importing private[$IDX]: subnet=$SUBNET_ID, assoc=$RT_ASSOC_ID"
                terraform state rm "module.vpc.aws_route_table_association.private[$IDX]" 2>&1 | grep -v "Invalid target address" || true
                ASSOC_OUTPUT=$(terraform import -input=false -lock=false "module.vpc.aws_route_table_association.private[$IDX]" "$RT_ASSOC_ID" 2>&1)
                echo "$ASSOC_OUTPUT"
                echo "$ASSOC_OUTPUT" | grep -qE "Import successful|already managed" && echo "      ✅ private[$IDX] imported" || echo "      ❌ private[$IDX] FAILED: $ASSOC_OUTPUT"
              fi
              IDX=$((IDX + 1))
            done
            
            # Import database subnet associations
            DATABASE_SUBNETS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$EXISTING_VPC_ID" "Name=tag:Name,Values=*database*" --region ap-south-1 --query 'Subnets | sort_by(@, &AvailabilityZone)[*].SubnetId' --output text 2>/dev/null || echo "")
            IDX=0
            for SUBNET_ID in $DATABASE_SUBNETS; do
              RT_ASSOC_ID=$(aws ec2 describe-route-tables --filters "Name=association.subnet-id,Values=$SUBNET_ID" --region ap-south-1 --query 'RouteTables[0].Associations[?SubnetId==`'$SUBNET_ID'`].RouteTableAssociationId' --output text 2>/dev/null || echo "")
              if [ -n "$RT_ASSOC_ID" ] && [ "$RT_ASSOC_ID" != "None" ] && [ "$RT_ASSOC_ID" != "" ]; then
                echo "      Importing database[$IDX]: subnet=$SUBNET_ID, assoc=$RT_ASSOC_ID"
                terraform state rm "module.vpc.aws_route_table_association.database[$IDX]" 2>&1 | grep -v "Invalid target address" || true
                ASSOC_OUTPUT=$(terraform import -input=false -lock=false "module.vpc.aws_route_table_association.database[$IDX]" "$RT_ASSOC_ID" 2>&1)
                echo "$ASSOC_OUTPUT"
                echo "$ASSOC_OUTPUT" | grep -qE "Import successful|already managed" && echo "      ✅ database[$IDX] imported" || echo "      ❌ database[$IDX] FAILED: $ASSOC_OUTPUT"
              fi
              IDX=$((IDX + 1))
            done
          fi
          
            # Verify imports succeeded
            echo ""
            echo "🔍 Verifying imports..."
            terraform state list | grep -E "module.vpc.aws_route_table|module.lambda.aws_lambda_alias|module.vpc.aws_eip|module.vpc.aws_nat_gateway" || echo "   ⚠️ Some resources not in state"
            
            echo ""
            echo "✅ NUCLEAR OPTION COMPLETE"
            echo "   use_existing_vpc = true (VPC limit reached)"
            echo "   All existing resources imported"
            echo "   Terraform will create ONLY missing resources"

      - name: Terraform Plan
        id: plan
        working-directory: infra/envs/dev
        run: |
          set +e  # Don't exit on error
          
          echo "🔍 Running terraform plan..."
          terraform plan \
            -var="opensearch_master_password=${{ secrets.DEV_OPENSEARCH_PASSWORD }}" \
            -var="razorpay_key_id=${{ secrets.RAZORPAY_KEY_ID }}" \
            -var="razorpay_key_secret=${{ secrets.RAZORPAY_KEY_SECRET }}" \
            -var="google_maps_api_key=${{ secrets.GOOGLE_MAPS_API_KEY }}" \
            -var="shiprocket_email=${{ secrets.SHIPROCKET_EMAIL }}" \
            -var="shiprocket_password=${{ secrets.SHIPROCKET_PASSWORD }}" \
            -out=tfplan \
            -detailed-exitcode 2>&1 | tee plan_output.txt
          
          EXIT_CODE=$?
          
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "TERRAFORM PLAN EXIT CODE: $EXIT_CODE"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""
          echo "Terraform plan exit codes:"
          echo "  0 = No changes, success"
          echo "  1 = Error occurred"
          echo "  2 = Successful plan with changes"
          echo ""
          
          # Terraform plan exit codes:
          # 0 = No changes, success
          # 1 = Error
          # 2 = Successful plan with changes
          
          if [ $EXIT_CODE -eq 0 ] || [ $EXIT_CODE -eq 2 ]; then
            echo "✅ Terraform plan successful (exit code: $EXIT_CODE)"
            if [ $EXIT_CODE -eq 2 ]; then
              echo "📋 Changes detected - ready to apply"
            else
              echo "✓ No changes needed"
            fi
            exit 0
          else
            echo "❌ Terraform plan failed (exit code: $EXIT_CODE)"
            echo ""
            echo "Last 50 lines of plan output:"
            tail -50 plan_output.txt || echo "Could not read plan output"
            exit 1
          fi

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infra/envs/dev/tfplan
          retention-days: 1

  # ============================================
  # TERRAFORM APPLY
  # ============================================
  terraform-apply:
    name: 🚀 Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment: dev
    permissions:
      id-token: write
      contents: read
    outputs:
      api_endpoint: ${{ steps.tf-outputs.outputs.api_endpoint }}
      s3_admin_bucket: ${{ steps.tf-outputs.outputs.s3_admin_bucket }}
      s3_vendor_bucket: ${{ steps.tf-outputs.outputs.s3_vendor_bucket }}
      s3_customer_bucket: ${{ steps.tf-outputs.outputs.s3_customer_bucket }}
      cloudfront_admin_id: ${{ steps.tf-outputs.outputs.cloudfront_admin_id }}
      cloudfront_vendor_id: ${{ steps.tf-outputs.outputs.cloudfront_vendor_id }}
      cloudfront_customer_id: ${{ steps.tf-outputs.outputs.cloudfront_customer_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Download Lambda artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-handlers
          path: backend/lambda

      - name: Download Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: infra/envs/dev

      - name: Terraform Init
        working-directory: infra/envs/dev
        run: terraform init -backend-config=backend.hcl

      - name: Force unlock stale Terraform state (ROBUST)
        continue-on-error: true
        timeout-minutes: 1
        run: |
          echo "🔓 CRITICAL: Checking and clearing ANY existing Terraform state locks..."
          
          # Method 1: Direct DynamoDB deletion (most reliable)
          echo "Method 1: Direct DynamoDB lock removal"
          aws dynamodb delete-item \
            --table-name warmpawz-terraform-locks \
            --key '{"LockID":{"S":"warmpawz-terraform-state-${{ secrets.AWS_ACCOUNT_ID }}/dev/terraform.tfstate"}}' \
            --region ap-south-1 2>&1 || echo "  No lock found in DynamoDB (this is OK)"
          
          # Method 2: Terraform force-unlock (backup method)
          echo ""
          echo "Method 2: Terraform force-unlock (if lock still exists)"
          cd infra/envs/dev
          
          # Get the lock info and extract UUID
          LOCK_INFO=$(aws dynamodb get-item \
            --table-name warmpawz-terraform-locks \
            --key '{"LockID":{"S":"warmpawz-terraform-state-${{ secrets.AWS_ACCOUNT_ID }}/dev/terraform.tfstate"}}' \
            --region ap-south-1 \
            --query 'Item.Info.S' \
            --output text 2>/dev/null || echo "")
          
          if [ -n "$LOCK_INFO" ] && [ "$LOCK_INFO" != "None" ]; then
            LOCK_UUID=$(echo "$LOCK_INFO" | jq -r '.ID' 2>/dev/null || echo "")
            if [ -n "$LOCK_UUID" ] && [ "$LOCK_UUID" != "null" ] && [ "$LOCK_UUID" != "" ]; then
              echo "  Found lock UUID: $LOCK_UUID"
              echo "  Force unlocking via Terraform..."
              terraform force-unlock -force "$LOCK_UUID" 2>&1 || echo "  Terraform unlock failed (may not be needed)"
            fi
          else
            echo "  No lock info found (state is clean)"
          fi
          
          echo ""
          echo "✅ State lock cleanup complete - ready for deployment"

      - name: Check VPC limit (prevent deployment failure)
        working-directory: infra/envs/dev
        continue-on-error: true
        run: |
          echo "🔍 Checking VPC limit..."
          VPC_COUNT=$(aws ec2 describe-vpcs --region ap-south-1 --query 'length(Vpcs)' --output text)
          VPC_LIMIT=5
          
          echo "Current VPC count: $VPC_COUNT / $VPC_LIMIT"
          
          if [ "$VPC_COUNT" -ge "$VPC_LIMIT" ]; then
            echo "⚠️  WARNING: VPC limit reached ($VPC_COUNT/$VPC_LIMIT)"
            echo "If VPC creation fails, delete unused VPCs or request limit increase"
            echo "Listing existing VPCs:"
            aws ec2 describe-vpcs --region ap-south-1 --query 'Vpcs[*].[VpcId,Tags[?Key==`Name`].Value|[0],CidrBlock]' --output table
          else
            echo "✅ VPC limit OK ($VPC_COUNT/$VPC_LIMIT)"
          fi

      - name: Terraform Apply
        working-directory: infra/envs/dev
        run: |
          # Apply with detailed logging
          terraform apply -auto-approve tfplan
          
          echo "✅ Terraform apply completed successfully"
          
          # If there were warnings about missing resources, they've been automatically removed from state
          echo "📋 Final resource count:"
          terraform state list | wc -l

      - name: Export outputs
        id: tf-outputs
        working-directory: infra/envs/dev
        run: |
          echo "api_endpoint=$(terraform output -raw api_endpoint)" >> $GITHUB_OUTPUT
          echo "s3_admin_bucket=$(terraform output -raw s3_admin_bucket)" >> $GITHUB_OUTPUT
          echo "s3_vendor_bucket=$(terraform output -raw s3_vendor_bucket)" >> $GITHUB_OUTPUT
          echo "s3_customer_bucket=$(terraform output -raw s3_customer_bucket)" >> $GITHUB_OUTPUT
          echo "cloudfront_admin_id=$(terraform output -raw cloudfront_admin_distribution_id)" >> $GITHUB_OUTPUT
          echo "cloudfront_vendor_id=$(terraform output -raw cloudfront_vendor_distribution_id)" >> $GITHUB_OUTPUT
          echo "cloudfront_customer_id=$(terraform output -raw cloudfront_customer_distribution_id)" >> $GITHUB_OUTPUT

  # ============================================
  # DEPLOY FRONTEND APPS
  # ============================================
  deploy-frontend:
    name: 🌐 Deploy Frontend Apps
    runs-on: ubuntu-latest
    needs: terraform-apply
    strategy:
      matrix:
        include:
          - app: admin-web
            bucket_output: s3_admin_bucket
            cloudfront_output: cloudfront_admin_id
          - app: vendor-web
            bucket_output: s3_vendor_bucket
            cloudfront_output: cloudfront_vendor_id
          - app: customer-web
            bucket_output: s3_customer_bucket
            cloudfront_output: cloudfront_customer_id
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-${{ matrix.app }}
          path: dist

      - name: Deploy to S3
        run: |
          aws s3 sync dist/ s3://${{ needs.terraform-apply.outputs[matrix.bucket_output] }}/ --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.terraform-apply.outputs[matrix.cloudfront_output] }} \
            --paths "/*"

  # ============================================
  # DATABASE MIGRATIONS
  # ============================================
  database-migrations:
    name: 🗄️ Run Database Migrations
    runs-on: ubuntu-latest
    needs: terraform-apply
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Get database credentials
        id: db-creds
        working-directory: infra/envs/dev
        run: |
          terraform init -backend-config=backend.hcl
          
          RDS_ENDPOINT=$(terraform output -raw rds_endpoint)
          RDS_SECRET_ARN=$(terraform output -raw rds_secret_arn)
          RDS_DB_NAME=$(terraform output -raw rds_database_name)
          RDS_PORT=$(terraform output -raw rds_port)
          
          DB_SECRET=$(aws secretsmanager get-secret-value --secret-id "$RDS_SECRET_ARN" --query SecretString --output text)
          DB_PASSWORD=$(echo "$DB_SECRET" | jq -r '.password // .Password // .')
          DB_USERNAME=$(echo "$DB_SECRET" | jq -r '.username // .Username // "postgres"')
          
          DATABASE_URL="postgresql://${DB_USERNAME}:${DB_PASSWORD}@${RDS_ENDPOINT}:${RDS_PORT}/${RDS_DB_NAME}"
          
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$DATABASE_URL"
          echo "database_url=$DATABASE_URL" >> $GITHUB_OUTPUT

      - name: Run migrations
        working-directory: db
        run: |
          npm ci
          npm run migrate:up
        env:
          DATABASE_URL: ${{ steps.db-creds.outputs.database_url }}
          ENVIRONMENT: dev

      - name: Verify migrations
        working-directory: db
        run: npm run migrate:status
        env:
          DATABASE_URL: ${{ steps.db-creds.outputs.database_url }}

  # ============================================
  # SEED DATA
  # ============================================
  seed-data:
    name: 🌱 Seed Base Data
    runs-on: ubuntu-latest
    needs: database-migrations
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Get database credentials
        id: db-creds
        working-directory: infra/envs/dev
        run: |
          terraform init -backend-config=backend.hcl
          
          RDS_ENDPOINT=$(terraform output -raw rds_endpoint)
          RDS_SECRET_ARN=$(terraform output -raw rds_secret_arn)
          RDS_DB_NAME=$(terraform output -raw rds_database_name)
          RDS_PORT=$(terraform output -raw rds_port)
          
          DB_SECRET=$(aws secretsmanager get-secret-value --secret-id "$RDS_SECRET_ARN" --query SecretString --output text)
          DB_PASSWORD=$(echo "$DB_SECRET" | jq -r '.password // .Password // .')
          DB_USERNAME=$(echo "$DB_SECRET" | jq -r '.username // .Username // "postgres"')
          
          DATABASE_URL="postgresql://${DB_USERNAME}:${DB_PASSWORD}@${RDS_ENDPOINT}:${RDS_PORT}/${RDS_DB_NAME}"
          
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$DATABASE_URL"
          echo "database_url=$DATABASE_URL" >> $GITHUB_OUTPUT

      - name: Seed database
        working-directory: db
        run: |
          npm ci
          npm run seed:dev
        env:
          DATABASE_URL: ${{ steps.db-creds.outputs.database_url }}
          ENVIRONMENT: dev

  # ============================================
  # SMOKE TESTS
  # ============================================
  smoke-tests:
    name: 💨 Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-frontend, seed-data]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test API endpoint
        run: |
          echo "Testing API health endpoint..."
          curl -f https://dev.api.warmpawz.com/health || echo "API health check pending..."

      - name: Test frontend URLs
        run: |
          echo "Testing frontend URLs..."
          curl -f https://dev.admin.warmpawz.com || echo "Admin app pending..."
          curl -f https://dev.vendor.warmpawz.com || echo "Vendor app pending..."
          curl -f https://dev.customer.warmpawz.com || echo "Customer app pending..."

  # ============================================
  # DEPLOYMENT SUMMARY
  # ============================================
  deployment-summary:
    name: 📊 Deployment Summary
    runs-on: ubuntu-latest
    needs: [smoke-tests, build-mobile-android]
    if: always()
    steps:
      - name: Download Android APKs
        uses: actions/download-artifact@v4
        with:
          pattern: android-*
          path: mobile-apks/
          merge-multiple: true

      - name: List artifacts
        run: |
          echo "📱 Mobile APKs built:"
          ls -la mobile-apks/ || echo "No APKs found"

      - name: Generate deployment report
        run: |
          echo "# 🚀 Development Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** dev" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🌐 Deployed URLs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| App | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| API | https://dev.api.warmpawz.com |" >> $GITHUB_STEP_SUMMARY
          echo "| Admin | https://dev.admin.warmpawz.com |" >> $GITHUB_STEP_SUMMARY
          echo "| Vendor | https://dev.vendor.warmpawz.com |" >> $GITHUB_STEP_SUMMARY
          echo "| Customer | https://dev.customer.warmpawz.com |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📱 Mobile Apps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Android APKs are available as workflow artifacts." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ✅ Deployment Status: SUCCESS" >> $GITHUB_STEP_SUMMARY
