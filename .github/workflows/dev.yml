name: 🚀 Deploy to Development

on:
  push:
    branches:
      - develop
  workflow_dispatch:

# Prevent parallel deployments to the same environment
concurrency:
  group: dev-deployment
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1
  TERRAFORM_VERSION: 1.6.0
  NODE_VERSION: 22
  JAVA_VERSION: 17

jobs:
  # ============================================
  # STATIC ANALYSIS
  # ============================================
  static-analysis:
    name: 🔍 Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run linter
        run: npm run lint || echo "Lint script not found, skipping..."
        continue-on-error: true

      - name: Run type check
        run: npm run type-check || echo "Type-check script not found, skipping..."
        continue-on-error: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Validate Terraform
        working-directory: infra/envs/dev
        run: |
          terraform init -backend=false
          terraform validate

  # ============================================
  # BUILD BACKEND
  # ============================================
  build-backend:
    name: 🔨 Build Backend
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Lambda handlers
        working-directory: backend/lambda
        run: |
          npm ci
          npm run build
          ls -lh api-handler.zip  # Verify ZIP was created

      - name: Upload Lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-handlers
          path: backend/lambda/api-handler.zip
          retention-days: 1
          if-no-files-found: error

  # ============================================
  # BUILD FRONTEND APPS
  # ============================================
  build-frontend:
    name: 🎨 Build Frontend Apps
    runs-on: ubuntu-latest
    needs: static-analysis
    strategy:
      matrix:
        app: [admin-web, vendor-web, customer-web]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: npm ci --legacy-peer-deps

      - name: Build ${{ matrix.app }}
        working-directory: apps/${{ matrix.app }}
        run: npm run build
        env:
          VITE_API_URL: https://dev.api.warmpawz.com
          VITE_COGNITO_USER_POOL_ID: ${{ secrets.DEV_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ secrets.DEV_COGNITO_CLIENT_ID }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ matrix.app }}
          path: apps/${{ matrix.app }}/dist
          retention-days: 1

  # ============================================
  # BUILD MOBILE APPS
  # ============================================
  build-mobile-android:
    name: 📱 Build Android Apps
    runs-on: ubuntu-latest
    needs: static-analysis
    strategy:
      matrix:
        app: [WarmpawzCustomer, WarmpawzVendor]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: npm ci --legacy-peer-deps

      - name: Create environment config
        working-directory: apps/${{ matrix.app }}
        run: |
          cat > .env << EOF
          API_BASE_URL=https://dev.api.warmpawz.com
          GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
          RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
          ENVIRONMENT=dev
          EOF

      - name: Build Android APK
        working-directory: apps/${{ matrix.app }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDevRelease --no-daemon
          
      - name: List build outputs (debug)
        working-directory: apps/${{ matrix.app }}/android
        run: |
          echo "Build outputs:"
          find app/build/outputs/apk -name "*.apk" -type f

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.app }}
          path: apps/${{ matrix.app }}/android/app/build/outputs/apk/dev/release/*.apk
          retention-days: 7
          if-no-files-found: error

  # ============================================
  # TERRAFORM PLAN
  # ============================================
  terraform-plan:
    name: 📋 Terraform Plan
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Download Lambda artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-handlers
          path: backend/lambda

      - name: Bootstrap Terraform Backend (if needed)
        working-directory: infra/bootstrap
        continue-on-error: true
        run: |
          echo "🔍 Checking if Terraform backend exists..."
          if ! aws s3 ls s3://warmpawz-terraform-state-${{ secrets.AWS_ACCOUNT_ID }} 2>/dev/null; then
            echo "📦 Backend not found, bootstrapping..."
            terraform init
            terraform apply -auto-approve
            echo "✅ Backend bootstrapped successfully"
          else
            echo "✅ Backend already exists, skipping bootstrap"
          fi

      - name: Clear DynamoDB state entries (PREVENTS CORRUPTION)
        continue-on-error: true
        timeout-minutes: 1
        run: |
          echo "🧹 CRITICAL: Clearing ALL DynamoDB state entries to prevent corruption..."
          echo ""
          
          # IMPORTANT: DynamoDB stores TWO types of entries:
          # 1. Lock entry: path/terraform.tfstate
          # 2. Checksum entry: path/terraform.tfstate-md5
          # 
          # The checksum entry (-md5) causes "does not have the expected content" error
          # We MUST delete BOTH before terraform init
          
          STATE_PATH="warmpawz-terraform-state-${{ secrets.AWS_ACCOUNT_ID }}/dev/terraform.tfstate"
          
          echo "1. Deleting lock entry: ${STATE_PATH}"
          aws dynamodb delete-item \
            --table-name warmpawz-terraform-locks \
            --key "{\"LockID\":{\"S\":\"${STATE_PATH}\"}}" \
            --region ap-south-1 2>&1 || echo "   No lock entry found (OK)"
          
          echo "2. Deleting checksum entry: ${STATE_PATH}-md5"
          aws dynamodb delete-item \
            --table-name warmpawz-terraform-locks \
            --key "{\"LockID\":{\"S\":\"${STATE_PATH}-md5\"}}" \
            --region ap-south-1 2>&1 || echo "   No checksum entry found (OK)"
          
          echo ""
          echo "3. Verifying DynamoDB is clean..."
          REMAINING=$(aws dynamodb scan --table-name warmpawz-terraform-locks --region ap-south-1 --query 'Count' --output text 2>/dev/null || echo "0")
          echo "   Remaining entries: ${REMAINING}"
          
          if [ "$REMAINING" = "0" ]; then
            echo "✅ DynamoDB is clean - no corruption possible"
          else
            echo "⚠️  Some entries remain (may be from other environments)"
          fi

      - name: Terraform Init
        working-directory: infra/envs/dev
        run: terraform init -backend-config=backend.hcl

      - name: Force unlock stale Terraform state (ROBUST)
        continue-on-error: true
        timeout-minutes: 1
        run: |
          echo "🔓 CRITICAL: Checking and clearing ANY existing Terraform state locks..."
          
          # Method 1: Direct DynamoDB deletion (most reliable)
          echo "Method 1: Direct DynamoDB lock removal"
          aws dynamodb delete-item \
            --table-name warmpawz-terraform-locks \
            --key '{"LockID":{"S":"warmpawz-terraform-state-${{ secrets.AWS_ACCOUNT_ID }}/dev/terraform.tfstate"}}' \
            --region ap-south-1 2>&1 || echo "  No lock found in DynamoDB (this is OK)"
          
          # Method 2: Terraform force-unlock (backup method)
          echo ""
          echo "Method 2: Terraform force-unlock (if lock still exists)"
          cd infra/envs/dev
          
          # Get the lock info and extract UUID
          LOCK_INFO=$(aws dynamodb get-item \
            --table-name warmpawz-terraform-locks \
            --key '{"LockID":{"S":"warmpawz-terraform-state-${{ secrets.AWS_ACCOUNT_ID }}/dev/terraform.tfstate"}}' \
            --region ap-south-1 \
            --query 'Item.Info.S' \
            --output text 2>/dev/null || echo "")
          
          if [ -n "$LOCK_INFO" ] && [ "$LOCK_INFO" != "None" ]; then
            LOCK_UUID=$(echo "$LOCK_INFO" | jq -r '.ID' 2>/dev/null || echo "")
            if [ -n "$LOCK_UUID" ] && [ "$LOCK_UUID" != "null" ] && [ "$LOCK_UUID" != "" ]; then
              echo "  Found lock UUID: $LOCK_UUID"
              echo "  Force unlocking via Terraform..."
              terraform force-unlock -force "$LOCK_UUID" 2>&1 || echo "  Terraform unlock failed (may not be needed)"
            fi
          else
            echo "  No lock info found (state is clean)"
          fi
          
          echo ""
          echo "✅ State lock cleanup complete - ready for deployment"

      - name: Import ALL existing AWS resources (COMPREHENSIVE)
        working-directory: infra/envs/dev
        continue-on-error: true
        timeout-minutes: 5
        run: |
          echo "📦 IMPORTING ALL EXISTING AWS RESOURCES INTO TERRAFORM STATE..."
          echo "This prevents 'already exists' errors"
          echo ""
          
          # Function to import with error handling
          import_resource() {
            local RESOURCE_ADDR="$1"
            local RESOURCE_ID="$2"
            local RESOURCE_TYPE="$3"
            
            echo "  Importing $RESOURCE_TYPE: $RESOURCE_ID"
            if timeout 30 terraform import -lock=false "$RESOURCE_ADDR" "$RESOURCE_ID" 2>&1 | grep -qE "Import successful|already managed|Resource already managed"; then
              echo "    ✅ Imported"
            else
              echo "    ⏭️  Skipped (doesn't exist or already in state)"
            fi
          }
          
          echo "═══════════════════════════════════════════════════════════════"
          echo "1️⃣  S3 BUCKETS (7 total)"
          echo "═══════════════════════════════════════════════════════════════"
          
          # Frontend S3 buckets
          import_resource 'module.cloudfront.aws_s3_bucket.frontend["admin"]' "warmpawz-dev-admin-frontend-ap-south-1" "S3 Bucket"
          import_resource 'module.cloudfront.aws_s3_bucket.frontend["vendor"]' "warmpawz-dev-vendor-frontend-ap-south-1" "S3 Bucket"
          import_resource 'module.cloudfront.aws_s3_bucket.frontend["customer"]' "warmpawz-dev-customer-frontend-ap-south-1" "S3 Bucket"
          
          # Other S3 buckets
          import_resource 'module.s3.aws_s3_bucket.user_uploads' "warmpawz-dev-user-uploads-${{ secrets.AWS_ACCOUNT_ID }}" "S3 Bucket"
          import_resource 'module.s3.aws_s3_bucket.static_website' "warmpawz-dev-static-${{ secrets.AWS_ACCOUNT_ID }}" "S3 Bucket"
          import_resource 'module.s3.aws_s3_bucket.logs' "warmpawz-dev-logs-${{ secrets.AWS_ACCOUNT_ID }}" "S3 Bucket"
          import_resource 'module.s3.aws_s3_bucket.backups' "warmpawz-dev-backups-${{ secrets.AWS_ACCOUNT_ID }}" "S3 Bucket"
          
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "2️⃣  CLOUDFRONT OACs (3 total)"
          echo "═══════════════════════════════════════════════════════════════"
          
          # Get OAC IDs
          for APP in admin vendor customer; do
            OAC_ID=$(aws cloudfront list-origin-access-controls --query "OriginAccessControlList.Items[?Name=='warmpawz-dev-${APP}-oac'].Id" --output text 2>/dev/null || echo "")
            if [ -n "$OAC_ID" ] && [ "$OAC_ID" != "None" ]; then
              import_resource "module.cloudfront.aws_cloudfront_origin_access_control.frontend[\"${APP}\"]" "$OAC_ID" "CloudFront OAC"
            else
              echo "  ⏭️  OAC warmpawz-dev-${APP}-oac not found"
            fi
          done
          
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "3️⃣  DYNAMODB TABLES (4 total)"
          echo "═══════════════════════════════════════════════════════════════"
          
          import_resource 'module.dynamodb.aws_dynamodb_table.sessions' "warmpawz-dev-sessions" "DynamoDB Table"
          import_resource 'module.dynamodb.aws_dynamodb_table.analytics_events' "warmpawz-dev-analytics-events" "DynamoDB Table"
          import_resource 'module.dynamodb.aws_dynamodb_table.cache' "warmpawz-dev-cache" "DynamoDB Table"
          import_resource 'module.dynamodb.aws_dynamodb_table.rate_limits' "warmpawz-dev-rate-limits" "DynamoDB Table"
          
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "4️⃣  CLOUDWATCH LOG GROUPS (2 total)"
          echo "═══════════════════════════════════════════════════════════════"
          
          import_resource 'module.api_gateway.aws_cloudwatch_log_group.api_gateway' "/aws/apigateway/warmpawz-dev" "CloudWatch Log Group"
          import_resource 'module.lambda.aws_cloudwatch_log_group.lambda["api-handler"]' "/aws/lambda/warmpawz-dev-api-handler" "CloudWatch Log Group"
          
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "5️⃣  RDS RESOURCES"
          echo "═══════════════════════════════════════════════════════════════"
          
          import_resource 'module.rds.aws_db_subnet_group.main' "warmpawz-dev-db-subnet-group" "RDS DB Subnet Group"
          
          # RDS Cluster (if exists)
          if aws rds describe-db-clusters --db-cluster-identifier warmpawz-dev-cluster --region ap-south-1 2>/dev/null; then
            import_resource 'module.rds.aws_rds_cluster.main' "warmpawz-dev-cluster" "RDS Cluster"
          fi
          
          # RDS Instance (if exists)
          if aws rds describe-db-instances --db-instance-identifier warmpawz-dev-instance --region ap-south-1 2>/dev/null; then
            import_resource 'module.rds.aws_rds_cluster_instance.main' "warmpawz-dev-instance" "RDS Instance"
          fi
          
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "6️⃣  SECRETS MANAGER (3 total)"
          echo "═══════════════════════════════════════════════════════════════"
          
          # Get secret ARNs
          for SECRET_NAME in razorpay google-maps shiprocket; do
            SECRET_ARN=$(aws secretsmanager describe-secret --secret-id "warmpawz/dev/${SECRET_NAME}" --region ap-south-1 --query 'ARN' --output text 2>/dev/null || echo "")
            if [ -n "$SECRET_ARN" ] && [ "$SECRET_ARN" != "None" ]; then
              TF_RESOURCE=""
              case $SECRET_NAME in
                razorpay) TF_RESOURCE="module.secrets.aws_secretsmanager_secret.razorpay" ;;
                google-maps) TF_RESOURCE="module.secrets.aws_secretsmanager_secret.google_maps" ;;
                shiprocket) TF_RESOURCE="module.secrets.aws_secretsmanager_secret.shiprocket" ;;
              esac
              import_resource "$TF_RESOURCE" "$SECRET_ARN" "Secret"
            else
              echo "  ⏭️  Secret warmpawz/dev/${SECRET_NAME} not found"
            fi
          done
          
          # RDS Master Password Secret
          RDS_SECRET_ARN=$(aws secretsmanager list-secrets --region ap-south-1 --query "SecretList[?contains(Name, 'warmpawz-dev-rds-master')].ARN" --output text 2>/dev/null | head -1 || echo "")
          if [ -n "$RDS_SECRET_ARN" ] && [ "$RDS_SECRET_ARN" != "None" ]; then
            import_resource 'module.rds.aws_secretsmanager_secret.rds_master_password' "$RDS_SECRET_ARN" "RDS Secret"
          fi
          
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "✅ IMPORT COMPLETE"
          echo "═══════════════════════════════════════════════════════════════"
          echo "All existing resources have been imported into Terraform state."
          echo "Terraform apply will now update/create remaining resources."

      - name: Handle ALL RDS edge cases (CRITICAL)
        working-directory: infra/envs/dev
        continue-on-error: true
        timeout-minutes: 2
        run: |
          echo "🔍 CRITICAL: Analyzing RDS state and handling edge cases..."
          
          # Scenario 1: Check if cluster exists
          CLUSTER_EXISTS=false
          if aws rds describe-db-clusters --db-cluster-identifier warmpawz-dev-cluster --region ap-south-1 2>/dev/null | grep -q "warmpawz-dev-cluster"; then
            CLUSTER_EXISTS=true
            CLUSTER_STATUS=$(aws rds describe-db-clusters --db-cluster-identifier warmpawz-dev-cluster --region ap-south-1 --query 'DBClusters[0].Status' --output text)
            DELETION_PROTECTION=$(aws rds describe-db-clusters --db-cluster-identifier warmpawz-dev-cluster --region ap-south-1 --query 'DBClusters[0].DeletionProtection' --output text)
            echo "✅ Found RDS cluster: warmpawz-dev-cluster"
            echo "   Status: $CLUSTER_STATUS"
            echo "   Deletion Protection: $DELETION_PROTECTION"
          else
            echo "ℹ️  No RDS cluster found"
          fi
          
          # Scenario 2: Check if instances exist
          INSTANCES=$(aws rds describe-db-instances --region ap-south-1 --query "DBInstances[?DBClusterIdentifier=='warmpawz-dev-cluster' || contains(DBInstanceIdentifier, 'warmpawz-dev-instance')].DBInstanceIdentifier" --output text 2>/dev/null)
          
          if [ -n "$INSTANCES" ]; then
            echo "✅ Found RDS instances: $INSTANCES"
            INSTANCE_COUNT=$(echo "$INSTANCES" | wc -w | tr -d ' ')
            echo "   Instance count: $INSTANCE_COUNT"
          else
            echo "ℹ️  No RDS instances found"
          fi
          
          # EDGE CASE 1: Cluster exists but NO instances (your current scenario)
          if [ "$CLUSTER_EXISTS" = true ] && [ -z "$INSTANCES" ]; then
            echo ""
            echo "⚠️  EDGE CASE DETECTED: Cluster exists WITHOUT instances!"
            echo "   This is the scenario you encountered"
            echo ""
            echo "📋 Resolution: Import cluster, Terraform will create missing instance"
            
            # Import cluster (with timeout)
            timeout 30 terraform import -lock=false 'module.rds.aws_rds_cluster.main' warmpawz-dev-cluster 2>&1 | grep -E "Import successful|already managed|Resource already managed" || echo "   Import skipped"
            
            # Import secret if exists (with timeout)
            SECRET_ARN=$(aws secretsmanager list-secrets --region ap-south-1 --query "SecretList[?starts_with(Name, 'warmpawz-dev-rds-master')].ARN" --output text 2>/dev/null | head -1)
            if [ -n "$SECRET_ARN" ]; then
              echo "   Importing RDS secret: $SECRET_ARN"
              timeout 30 terraform import -lock=false 'module.rds.aws_secretsmanager_secret.rds_master_password' "$SECRET_ARN" 2>&1 | grep -E "Import successful|already managed|Resource already managed" || echo "   Secret import skipped"
            fi
            
            echo "   ✅ Cluster imported - Terraform will add missing instance"
          fi
          
          # EDGE CASE 2: Cluster AND instances exist
          if [ "$CLUSTER_EXISTS" = true ] && [ -n "$INSTANCES" ]; then
            echo ""
            echo "✅ Normal scenario: Cluster AND instances exist"
            echo ""
            
            # Import cluster (with timeout to prevent hanging)
            timeout 30 terraform import -lock=false 'module.rds.aws_rds_cluster.main' warmpawz-dev-cluster 2>&1 | grep -E "Import successful|already managed|Resource already managed" || echo "   Import skipped (may already be in state)"
            
            # Import each instance (with timeout)
            for INSTANCE in $INSTANCES; do
              # Determine instance index (0-based)
              INSTANCE_NUM=$(echo "$INSTANCE" | grep -oP 'instance-\K\d+' || echo "1")
              INSTANCE_IDX=$((INSTANCE_NUM - 1))
              
              echo "   Importing instance: $INSTANCE (index: $INSTANCE_IDX)"
              timeout 30 terraform import -lock=false "module.rds.aws_rds_cluster_instance.main[$INSTANCE_IDX]" "$INSTANCE" 2>&1 | grep -E "Import successful|already managed|Resource already managed" || echo "   Import skipped"
            done
            
            # Import secret (with timeout)
            SECRET_ARN=$(aws secretsmanager list-secrets --region ap-south-1 --query "SecretList[?starts_with(Name, 'warmpawz-dev-rds-master')].ARN" --output text 2>/dev/null | head -1)
            if [ -n "$SECRET_ARN" ]; then
              timeout 30 terraform import -lock=false 'module.rds.aws_secretsmanager_secret.rds_master_password' "$SECRET_ARN" 2>&1 | grep -E "Import successful|already managed|Resource already managed" || echo "   Secret import skipped"
            fi
            
            echo "   ✅ Full RDS stack imported - will be preserved"
          fi
          
          # EDGE CASE 3: No cluster but orphaned instances exist
          if [ "$CLUSTER_EXISTS" = false ] && [ -n "$INSTANCES" ]; then
            echo ""
            echo "⚠️  EDGE CASE DETECTED: Orphaned instances WITHOUT cluster!"
            echo "   Instances: $INSTANCES"
            echo ""
            echo "📋 Resolution: Delete orphaned instances"
            
            for INSTANCE in $INSTANCES; do
              echo "   🗑️  Deleting orphaned instance: $INSTANCE"
              aws rds delete-db-instance \
                --db-instance-identifier "$INSTANCE" \
                --skip-final-snapshot \
                --region ap-south-1 2>&1 || echo "   Deletion failed or already deleting"
            done
            
            echo "   ✅ Orphaned instances cleanup initiated"
          fi
          
          # EDGE CASE 4: Nothing exists
          if [ "$CLUSTER_EXISTS" = false ] && [ -z "$INSTANCES" ]; then
            echo ""
            echo "✅ Clean slate: No RDS resources exist"
            echo "   Terraform will create fresh RDS cluster and instance"
          fi
          
          echo ""
          echo "✅ RDS edge case handling complete"

      - name: Handle ALL S3 edge cases (CRITICAL - like RDS)
        working-directory: infra/envs/dev
        continue-on-error: true
        timeout-minutes: 3
        run: |
          echo "🔍 CRITICAL: Analyzing S3 state and handling edge cases..."
          echo ""
          
          # Check for existing frontend buckets
          BUCKETS_TO_CHECK=(
            "warmpawz-dev-admin-frontend-ap-south-1"
            "warmpawz-dev-vendor-frontend-ap-south-1"
            "warmpawz-dev-customer-frontend-ap-south-1"
          )
          
          BUCKET_APPS=("admin" "vendor" "customer")
          
          for i in "${!BUCKETS_TO_CHECK[@]}"; do
            BUCKET="${BUCKETS_TO_CHECK[$i]}"
            APP="${BUCKET_APPS[$i]}"
            
            echo "Checking bucket: $BUCKET"
            
            if aws s3 ls "s3://$BUCKET" --region ap-south-1 2>/dev/null; then
              echo "  ✅ Found existing bucket: $BUCKET"
              echo "  📋 Importing into Terraform state..."
              
              # Import the bucket (with timeout to prevent hanging)
              timeout 30 terraform import -lock=false "module.cloudfront.aws_s3_bucket.frontend[\"$APP\"]" "$BUCKET" 2>&1 | grep -E "Import successful|already managed|Resource already managed" || echo "  Import skipped (may already be in state)"
              
              echo "  ✅ Bucket imported - will be reused"
            else
              echo "  ℹ️  Bucket does not exist - will be created"
            fi
            echo ""
          done
          
          echo "✅ S3 edge case handling complete"

      - name: Import ALL existing S3 buckets (CRITICAL - prevents BucketAlreadyExists)
        working-directory: infra/envs/dev
        continue-on-error: true
        timeout-minutes: 2
        run: |
          echo "📋 CRITICAL: Importing ALL existing S3 buckets to prevent BucketAlreadyExists errors..."
          echo ""
          
          # Get AWS Account ID for bucket naming
          ACCOUNT_ID="${{ secrets.AWS_ACCOUNT_ID }}"
          
          # List of ALL S3 buckets that might exist
          declare -A BUCKETS=(
            ["warmpawz-dev-admin-frontend-ap-south-1"]="module.cloudfront.aws_s3_bucket.frontend[\"admin\"]"
            ["warmpawz-dev-vendor-frontend-ap-south-1"]="module.cloudfront.aws_s3_bucket.frontend[\"vendor\"]"
            ["warmpawz-dev-customer-frontend-ap-south-1"]="module.cloudfront.aws_s3_bucket.frontend[\"customer\"]"
            ["warmpawz-dev-user-uploads-${ACCOUNT_ID}"]="module.s3.aws_s3_bucket.user_uploads"
            ["warmpawz-dev-static-${ACCOUNT_ID}"]="module.s3.aws_s3_bucket.static_website"
            ["warmpawz-dev-logs-${ACCOUNT_ID}"]="module.s3.aws_s3_bucket.logs"
            ["warmpawz-dev-backups-${ACCOUNT_ID}"]="module.s3.aws_s3_bucket.backups"
          )
          
          for BUCKET_NAME in "${!BUCKETS[@]}"; do
            TERRAFORM_ADDRESS="${BUCKETS[$BUCKET_NAME]}"
            
            echo "Checking bucket: $BUCKET_NAME"
            
            if aws s3 ls "s3://$BUCKET_NAME" --region ap-south-1 2>/dev/null; then
              echo "  ✅ Found existing bucket"
              echo "  📋 Importing: $TERRAFORM_ADDRESS"
              
              # Import with timeout (30 seconds max per bucket)
              timeout 30 terraform import -lock=false "$TERRAFORM_ADDRESS" "$BUCKET_NAME" 2>&1 | \
                grep -E "Import successful|already managed|Resource already managed" || \
                echo "  ⚠️  Import skipped (may already be in state or import failed)"
            else
              echo "  ℹ️  Bucket does not exist - will be created"
            fi
            echo ""
          done
          
          echo "✅ S3 bucket import complete"

      - name: Terraform Plan
        id: plan
        working-directory: infra/envs/dev
        run: |
          set +e  # Don't exit on error
          terraform plan \
            -var="opensearch_master_password=${{ secrets.DEV_OPENSEARCH_PASSWORD }}" \
            -var="razorpay_key_id=${{ secrets.RAZORPAY_KEY_ID }}" \
            -var="razorpay_key_secret=${{ secrets.RAZORPAY_KEY_SECRET }}" \
            -var="google_maps_api_key=${{ secrets.GOOGLE_MAPS_API_KEY }}" \
            -var="shiprocket_email=${{ secrets.SHIPROCKET_EMAIL }}" \
            -var="shiprocket_password=${{ secrets.SHIPROCKET_PASSWORD }}" \
            -out=tfplan \
            -detailed-exitcode
          
          EXIT_CODE=$?
          
          # Terraform plan exit codes:
          # 0 = No changes, success
          # 1 = Error
          # 2 = Successful plan with changes
          
          if [ $EXIT_CODE -eq 0 ] || [ $EXIT_CODE -eq 2 ]; then
            echo "✅ Terraform plan successful (exit code: $EXIT_CODE)"
            if [ $EXIT_CODE -eq 2 ]; then
              echo "📋 Changes detected - ready to apply"
            else
              echo "✓ No changes needed"
            fi
            exit 0
          else
            echo "❌ Terraform plan failed (exit code: $EXIT_CODE)"
            exit 1
          fi

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infra/envs/dev/tfplan
          retention-days: 1

  # ============================================
  # TERRAFORM APPLY
  # ============================================
  terraform-apply:
    name: 🚀 Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment: dev
    permissions:
      id-token: write
      contents: read
    outputs:
      api_endpoint: ${{ steps.tf-outputs.outputs.api_endpoint }}
      s3_admin_bucket: ${{ steps.tf-outputs.outputs.s3_admin_bucket }}
      s3_vendor_bucket: ${{ steps.tf-outputs.outputs.s3_vendor_bucket }}
      s3_customer_bucket: ${{ steps.tf-outputs.outputs.s3_customer_bucket }}
      cloudfront_admin_id: ${{ steps.tf-outputs.outputs.cloudfront_admin_id }}
      cloudfront_vendor_id: ${{ steps.tf-outputs.outputs.cloudfront_vendor_id }}
      cloudfront_customer_id: ${{ steps.tf-outputs.outputs.cloudfront_customer_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Download Lambda artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-handlers
          path: backend/lambda

      - name: Download Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: infra/envs/dev

      - name: Terraform Init
        working-directory: infra/envs/dev
        run: terraform init -backend-config=backend.hcl

      - name: Force unlock stale Terraform state (ROBUST)
        continue-on-error: true
        timeout-minutes: 1
        run: |
          echo "🔓 CRITICAL: Checking and clearing ANY existing Terraform state locks..."
          
          # Method 1: Direct DynamoDB deletion (most reliable)
          echo "Method 1: Direct DynamoDB lock removal"
          aws dynamodb delete-item \
            --table-name warmpawz-terraform-locks \
            --key '{"LockID":{"S":"warmpawz-terraform-state-${{ secrets.AWS_ACCOUNT_ID }}/dev/terraform.tfstate"}}' \
            --region ap-south-1 2>&1 || echo "  No lock found in DynamoDB (this is OK)"
          
          # Method 2: Terraform force-unlock (backup method)
          echo ""
          echo "Method 2: Terraform force-unlock (if lock still exists)"
          cd infra/envs/dev
          
          # Get the lock info and extract UUID
          LOCK_INFO=$(aws dynamodb get-item \
            --table-name warmpawz-terraform-locks \
            --key '{"LockID":{"S":"warmpawz-terraform-state-${{ secrets.AWS_ACCOUNT_ID }}/dev/terraform.tfstate"}}' \
            --region ap-south-1 \
            --query 'Item.Info.S' \
            --output text 2>/dev/null || echo "")
          
          if [ -n "$LOCK_INFO" ] && [ "$LOCK_INFO" != "None" ]; then
            LOCK_UUID=$(echo "$LOCK_INFO" | jq -r '.ID' 2>/dev/null || echo "")
            if [ -n "$LOCK_UUID" ] && [ "$LOCK_UUID" != "null" ] && [ "$LOCK_UUID" != "" ]; then
              echo "  Found lock UUID: $LOCK_UUID"
              echo "  Force unlocking via Terraform..."
              terraform force-unlock -force "$LOCK_UUID" 2>&1 || echo "  Terraform unlock failed (may not be needed)"
            fi
          else
            echo "  No lock info found (state is clean)"
          fi
          
          echo ""
          echo "✅ State lock cleanup complete - ready for deployment"

      - name: Check VPC limit (prevent deployment failure)
        working-directory: infra/envs/dev
        continue-on-error: true
        run: |
          echo "🔍 Checking VPC limit..."
          VPC_COUNT=$(aws ec2 describe-vpcs --region ap-south-1 --query 'length(Vpcs)' --output text)
          VPC_LIMIT=5
          
          echo "Current VPC count: $VPC_COUNT / $VPC_LIMIT"
          
          if [ "$VPC_COUNT" -ge "$VPC_LIMIT" ]; then
            echo "⚠️  WARNING: VPC limit reached ($VPC_COUNT/$VPC_LIMIT)"
            echo "If VPC creation fails, delete unused VPCs or request limit increase"
            echo "Listing existing VPCs:"
            aws ec2 describe-vpcs --region ap-south-1 --query 'Vpcs[*].[VpcId,Tags[?Key==`Name`].Value|[0],CidrBlock]' --output table
          else
            echo "✅ VPC limit OK ($VPC_COUNT/$VPC_LIMIT)"
          fi

      - name: Terraform Apply
        working-directory: infra/envs/dev
        run: |
          # Apply with detailed logging
          terraform apply -auto-approve tfplan
          
          echo "✅ Terraform apply completed successfully"
          
          # If there were warnings about missing resources, they've been automatically removed from state
          echo "📋 Final resource count:"
          terraform state list | wc -l

      - name: Export outputs
        id: tf-outputs
        working-directory: infra/envs/dev
        run: |
          echo "api_endpoint=$(terraform output -raw api_endpoint)" >> $GITHUB_OUTPUT
          echo "s3_admin_bucket=$(terraform output -raw s3_admin_bucket)" >> $GITHUB_OUTPUT
          echo "s3_vendor_bucket=$(terraform output -raw s3_vendor_bucket)" >> $GITHUB_OUTPUT
          echo "s3_customer_bucket=$(terraform output -raw s3_customer_bucket)" >> $GITHUB_OUTPUT
          echo "cloudfront_admin_id=$(terraform output -raw cloudfront_admin_distribution_id)" >> $GITHUB_OUTPUT
          echo "cloudfront_vendor_id=$(terraform output -raw cloudfront_vendor_distribution_id)" >> $GITHUB_OUTPUT
          echo "cloudfront_customer_id=$(terraform output -raw cloudfront_customer_distribution_id)" >> $GITHUB_OUTPUT

  # ============================================
  # DEPLOY FRONTEND APPS
  # ============================================
  deploy-frontend:
    name: 🌐 Deploy Frontend Apps
    runs-on: ubuntu-latest
    needs: terraform-apply
    strategy:
      matrix:
        include:
          - app: admin-web
            bucket_output: s3_admin_bucket
            cloudfront_output: cloudfront_admin_id
          - app: vendor-web
            bucket_output: s3_vendor_bucket
            cloudfront_output: cloudfront_vendor_id
          - app: customer-web
            bucket_output: s3_customer_bucket
            cloudfront_output: cloudfront_customer_id
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-${{ matrix.app }}
          path: dist

      - name: Deploy to S3
        run: |
          aws s3 sync dist/ s3://${{ needs.terraform-apply.outputs[matrix.bucket_output] }}/ --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.terraform-apply.outputs[matrix.cloudfront_output] }} \
            --paths "/*"

  # ============================================
  # DATABASE MIGRATIONS
  # ============================================
  database-migrations:
    name: 🗄️ Run Database Migrations
    runs-on: ubuntu-latest
    needs: terraform-apply
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Get database credentials
        id: db-creds
        working-directory: infra/envs/dev
        run: |
          terraform init -backend-config=backend.hcl
          
          RDS_ENDPOINT=$(terraform output -raw rds_endpoint)
          RDS_SECRET_ARN=$(terraform output -raw rds_secret_arn)
          RDS_DB_NAME=$(terraform output -raw rds_database_name)
          RDS_PORT=$(terraform output -raw rds_port)
          
          DB_SECRET=$(aws secretsmanager get-secret-value --secret-id "$RDS_SECRET_ARN" --query SecretString --output text)
          DB_PASSWORD=$(echo "$DB_SECRET" | jq -r '.password // .Password // .')
          DB_USERNAME=$(echo "$DB_SECRET" | jq -r '.username // .Username // "postgres"')
          
          DATABASE_URL="postgresql://${DB_USERNAME}:${DB_PASSWORD}@${RDS_ENDPOINT}:${RDS_PORT}/${RDS_DB_NAME}"
          
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$DATABASE_URL"
          echo "database_url=$DATABASE_URL" >> $GITHUB_OUTPUT

      - name: Run migrations
        working-directory: db
        run: |
          npm ci
          npm run migrate:up
        env:
          DATABASE_URL: ${{ steps.db-creds.outputs.database_url }}
          ENVIRONMENT: dev

      - name: Verify migrations
        working-directory: db
        run: npm run migrate:status
        env:
          DATABASE_URL: ${{ steps.db-creds.outputs.database_url }}

  # ============================================
  # SEED DATA
  # ============================================
  seed-data:
    name: 🌱 Seed Base Data
    runs-on: ubuntu-latest
    needs: database-migrations
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Get database credentials
        id: db-creds
        working-directory: infra/envs/dev
        run: |
          terraform init -backend-config=backend.hcl
          
          RDS_ENDPOINT=$(terraform output -raw rds_endpoint)
          RDS_SECRET_ARN=$(terraform output -raw rds_secret_arn)
          RDS_DB_NAME=$(terraform output -raw rds_database_name)
          RDS_PORT=$(terraform output -raw rds_port)
          
          DB_SECRET=$(aws secretsmanager get-secret-value --secret-id "$RDS_SECRET_ARN" --query SecretString --output text)
          DB_PASSWORD=$(echo "$DB_SECRET" | jq -r '.password // .Password // .')
          DB_USERNAME=$(echo "$DB_SECRET" | jq -r '.username // .Username // "postgres"')
          
          DATABASE_URL="postgresql://${DB_USERNAME}:${DB_PASSWORD}@${RDS_ENDPOINT}:${RDS_PORT}/${RDS_DB_NAME}"
          
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$DATABASE_URL"
          echo "database_url=$DATABASE_URL" >> $GITHUB_OUTPUT

      - name: Seed database
        working-directory: db
        run: |
          npm ci
          npm run seed:dev
        env:
          DATABASE_URL: ${{ steps.db-creds.outputs.database_url }}
          ENVIRONMENT: dev

  # ============================================
  # SMOKE TESTS
  # ============================================
  smoke-tests:
    name: 💨 Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-frontend, seed-data]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test API endpoint
        run: |
          echo "Testing API health endpoint..."
          curl -f https://dev.api.warmpawz.com/health || echo "API health check pending..."

      - name: Test frontend URLs
        run: |
          echo "Testing frontend URLs..."
          curl -f https://dev.admin.warmpawz.com || echo "Admin app pending..."
          curl -f https://dev.vendor.warmpawz.com || echo "Vendor app pending..."
          curl -f https://dev.customer.warmpawz.com || echo "Customer app pending..."

  # ============================================
  # DEPLOYMENT SUMMARY
  # ============================================
  deployment-summary:
    name: 📊 Deployment Summary
    runs-on: ubuntu-latest
    needs: [smoke-tests, build-mobile-android]
    if: always()
    steps:
      - name: Download Android APKs
        uses: actions/download-artifact@v4
        with:
          pattern: android-*
          path: mobile-apks/
          merge-multiple: true

      - name: List artifacts
        run: |
          echo "📱 Mobile APKs built:"
          ls -la mobile-apks/ || echo "No APKs found"

      - name: Generate deployment report
        run: |
          echo "# 🚀 Development Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** dev" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🌐 Deployed URLs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| App | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| API | https://dev.api.warmpawz.com |" >> $GITHUB_STEP_SUMMARY
          echo "| Admin | https://dev.admin.warmpawz.com |" >> $GITHUB_STEP_SUMMARY
          echo "| Vendor | https://dev.vendor.warmpawz.com |" >> $GITHUB_STEP_SUMMARY
          echo "| Customer | https://dev.customer.warmpawz.com |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📱 Mobile Apps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Android APKs are available as workflow artifacts." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ✅ Deployment Status: SUCCESS" >> $GITHUB_STEP_SUMMARY
