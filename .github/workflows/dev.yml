name: 🚀 Deploy to Development

on:
  push:
    branches:
      - develop
  workflow_dispatch:

# Prevent parallel deployments to the same environment
concurrency:
  group: dev-deployment
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1
  TERRAFORM_VERSION: 1.6.0
  NODE_VERSION: 22
  JAVA_VERSION: 17

jobs:
  # ============================================
  # STATIC ANALYSIS
  # ============================================
  static-analysis:
    name: 🔍 Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run linter
        run: npm run lint || echo "Lint script not found, skipping..."
        continue-on-error: true

      - name: Run type check
        run: npm run type-check || echo "Type-check script not found, skipping..."
        continue-on-error: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Validate Terraform
        working-directory: infra/envs/dev
        run: |
          terraform init -backend=false
          terraform validate

  # ============================================
  # BUILD BACKEND
  # ============================================
  build-backend:
    name: 🔨 Build Backend
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Lambda handlers
        working-directory: backend/lambda
        run: |
          npm ci
          npm run build
          ls -lh api-handler.zip  # Verify ZIP was created

      - name: Upload Lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-handlers
          path: backend/lambda/api-handler.zip
          retention-days: 1
          if-no-files-found: error

  # ============================================
  # BUILD FRONTEND APPS
  # ============================================
  build-frontend:
    name: 🎨 Build Frontend Apps
    runs-on: ubuntu-latest
    needs: static-analysis
    strategy:
      matrix:
        app: [admin-web, vendor-web, customer-web]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: npm ci --legacy-peer-deps

      - name: Build ${{ matrix.app }}
        working-directory: apps/${{ matrix.app }}
        run: npm run build
        env:
          VITE_API_URL: https://dev.api.warmpawz.com
          VITE_COGNITO_USER_POOL_ID: ${{ secrets.DEV_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ secrets.DEV_COGNITO_CLIENT_ID }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ matrix.app }}
          path: apps/${{ matrix.app }}/dist
          retention-days: 1

  # ============================================
  # BUILD MOBILE APPS
  # ============================================
  build-mobile-android:
    name: 📱 Build Android Apps
    runs-on: ubuntu-latest
    needs: static-analysis
    strategy:
      matrix:
        app: [WarmpawzCustomer, WarmpawzVendor]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: npm ci --legacy-peer-deps

      - name: Create environment config
        working-directory: apps/${{ matrix.app }}
        run: |
          cat > .env << EOF
          API_BASE_URL=https://dev.api.warmpawz.com
          GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
          RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
          ENVIRONMENT=dev
          EOF

      - name: Build Android APK
        working-directory: apps/${{ matrix.app }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDevRelease --no-daemon
          
      - name: List build outputs (debug)
        working-directory: apps/${{ matrix.app }}/android
        run: |
          echo "Build outputs:"
          find app/build/outputs/apk -name "*.apk" -type f

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.app }}
          path: apps/${{ matrix.app }}/android/app/build/outputs/apk/dev/release/*.apk
          retention-days: 7
          if-no-files-found: error

  # ============================================
  # TERRAFORM PLAN
  # ============================================
  terraform-plan:
    name: 📋 Terraform Plan
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Download Lambda artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-handlers
          path: backend/lambda

      - name: Terraform Init
        working-directory: infra/envs/dev
        run: terraform init -backend-config=backend.hcl

      - name: Force unlock stale Terraform state (if any)
        working-directory: infra/envs/dev
        continue-on-error: true
        run: |
          # Get any existing lock and force-unlock it
          # This is safe because we have concurrency control that cancels parallel runs
          LOCK_ID=$(aws dynamodb scan --table-name warmpawz-terraform-locks \
            --filter-expression "LockID = :lockid" \
            --expression-attribute-values '{":lockid":{"S":"warmpawz-terraform-state-023394150666/dev/terraform.tfstate"}}' \
            --query 'Items[0].Info.S' --output text 2>/dev/null || echo "")
          if [ -n "$LOCK_ID" ] && [ "$LOCK_ID" != "None" ]; then
            LOCK_UUID=$(echo "$LOCK_ID" | jq -r '.ID' 2>/dev/null || echo "")
            if [ -n "$LOCK_UUID" ] && [ "$LOCK_UUID" != "null" ]; then
              echo "Found stale lock: $LOCK_UUID, force unlocking..."
              terraform force-unlock -force "$LOCK_UUID" || true
            fi
          fi

      - name: Auto-import existing resources (idempotent)
        working-directory: infra/envs/dev
        continue-on-error: true
        run: |
          echo "🔄 Auto-importing existing resources (if any)..."
          echo "This makes the workflow idempotent and reusable - existing resources are imported, new ones will be created"
          
          # Import existing resources if they exist (ignore errors if already imported or don't exist)
          # This allows the workflow to run multiple times without ResourceAlreadyExists errors
          terraform import 'module.cloudfront.aws_s3_bucket.frontend["admin"]' warmpawz-dev-admin-frontend-ap-south-1 2>/dev/null || true
          terraform import 'module.cloudfront.aws_s3_bucket.frontend["vendor"]' warmpawz-dev-vendor-frontend-ap-south-1 2>/dev/null || true
          terraform import 'module.cloudfront.aws_s3_bucket.frontend["customer"]' warmpawz-dev-customer-frontend-ap-south-1 2>/dev/null || true
          terraform import 'module.s3.aws_s3_bucket.user_uploads' warmpawz-dev-user-uploads-023394150666 2>/dev/null || true
          terraform import 'module.s3.aws_s3_bucket.static_website' warmpawz-dev-static-023394150666 2>/dev/null || true
          terraform import 'module.s3.aws_s3_bucket.logs' warmpawz-dev-logs-023394150666 2>/dev/null || true
          terraform import 'module.s3.aws_s3_bucket.backups' warmpawz-dev-backups-023394150666 2>/dev/null || true
          terraform import 'module.dynamodb.aws_dynamodb_table.sessions' warmpawz-dev-sessions 2>/dev/null || true
          terraform import 'module.dynamodb.aws_dynamodb_table.analytics_events' warmpawz-dev-analytics-events 2>/dev/null || true
          terraform import 'module.dynamodb.aws_dynamodb_table.cache' warmpawz-dev-cache 2>/dev/null || true
          terraform import 'module.dynamodb.aws_dynamodb_table.rate_limits' warmpawz-dev-rate-limits 2>/dev/null || true
          terraform import 'module.api_gateway.aws_cloudwatch_log_group.api_gateway' /aws/apigateway/warmpawz-dev 2>/dev/null || true
          terraform import 'module.lambda.aws_cloudwatch_log_group.lambda["api-handler"]' /aws/lambda/warmpawz-dev-api-handler 2>/dev/null || true
          terraform import 'module.secrets.aws_secretsmanager_secret.razorpay' warmpawz/dev/razorpay 2>/dev/null || true
          terraform import 'module.secrets.aws_secretsmanager_secret.google_maps' warmpawz/dev/google-maps 2>/dev/null || true
          terraform import 'module.secrets.aws_secretsmanager_secret.shiprocket' warmpawz/dev/shiprocket 2>/dev/null || true
          
          echo "✅ Auto-import completed (existing resources imported, new ones will be created in plan)"

      - name: Terraform Plan
        id: plan
        working-directory: infra/envs/dev
        run: |
          set +e  # Don't exit on error
          terraform plan \
            -var="opensearch_master_password=${{ secrets.DEV_OPENSEARCH_PASSWORD }}" \
            -var="razorpay_key_id=${{ secrets.RAZORPAY_KEY_ID }}" \
            -var="razorpay_key_secret=${{ secrets.RAZORPAY_KEY_SECRET }}" \
            -var="google_maps_api_key=${{ secrets.GOOGLE_MAPS_API_KEY }}" \
            -var="shiprocket_email=${{ secrets.SHIPROCKET_EMAIL }}" \
            -var="shiprocket_password=${{ secrets.SHIPROCKET_PASSWORD }}" \
            -out=tfplan \
            -detailed-exitcode
          
          EXIT_CODE=$?
          
          # Terraform plan exit codes:
          # 0 = No changes, success
          # 1 = Error
          # 2 = Successful plan with changes
          
          if [ $EXIT_CODE -eq 0 ] || [ $EXIT_CODE -eq 2 ]; then
            echo "✅ Terraform plan successful (exit code: $EXIT_CODE)"
            if [ $EXIT_CODE -eq 2 ]; then
              echo "📋 Changes detected - ready to apply"
            else
              echo "✓ No changes needed"
            fi
            exit 0
          else
            echo "❌ Terraform plan failed (exit code: $EXIT_CODE)"
            exit 1
          fi

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infra/envs/dev/tfplan
          retention-days: 1

  # ============================================
  # TERRAFORM APPLY
  # ============================================
  terraform-apply:
    name: 🚀 Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment: dev
    permissions:
      id-token: write
      contents: read
    outputs:
      api_endpoint: ${{ steps.tf-outputs.outputs.api_endpoint }}
      s3_admin_bucket: ${{ steps.tf-outputs.outputs.s3_admin_bucket }}
      s3_vendor_bucket: ${{ steps.tf-outputs.outputs.s3_vendor_bucket }}
      s3_customer_bucket: ${{ steps.tf-outputs.outputs.s3_customer_bucket }}
      cloudfront_admin_id: ${{ steps.tf-outputs.outputs.cloudfront_admin_id }}
      cloudfront_vendor_id: ${{ steps.tf-outputs.outputs.cloudfront_vendor_id }}
      cloudfront_customer_id: ${{ steps.tf-outputs.outputs.cloudfront_customer_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Download Lambda artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-handlers
          path: backend/lambda

      - name: Download Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: infra/envs/dev

      - name: Terraform Init
        working-directory: infra/envs/dev
        run: terraform init -backend-config=backend.hcl

      - name: Force unlock stale Terraform state (if any)
        working-directory: infra/envs/dev
        continue-on-error: true
        run: |
          # Get any existing lock and force-unlock it
          # This is safe because we have concurrency control that cancels parallel runs
          LOCK_ID=$(aws dynamodb scan --table-name warmpawz-terraform-locks \
            --filter-expression "LockID = :lockid" \
            --expression-attribute-values '{":lockid":{"S":"warmpawz-terraform-state-023394150666/dev/terraform.tfstate"}}' \
            --query 'Items[0].Info.S' --output text 2>/dev/null || echo "")
          if [ -n "$LOCK_ID" ] && [ "$LOCK_ID" != "None" ]; then
            LOCK_UUID=$(echo "$LOCK_ID" | jq -r '.ID' 2>/dev/null || echo "")
            if [ -n "$LOCK_UUID" ] && [ "$LOCK_UUID" != "null" ]; then
              echo "Found stale lock: $LOCK_UUID, force unlocking..."
              terraform force-unlock -force "$LOCK_UUID" || true
            fi
          fi

      - name: Check VPC limit (prevent deployment failure)
        working-directory: infra/envs/dev
        continue-on-error: true
        run: |
          echo "🔍 Checking VPC limit..."
          VPC_COUNT=$(aws ec2 describe-vpcs --region ap-south-1 --query 'length(Vpcs)' --output text)
          VPC_LIMIT=5
          
          echo "Current VPC count: $VPC_COUNT / $VPC_LIMIT"
          
          if [ "$VPC_COUNT" -ge "$VPC_LIMIT" ]; then
            echo "⚠️  WARNING: VPC limit reached ($VPC_COUNT/$VPC_LIMIT)"
            echo "If VPC creation fails, delete unused VPCs or request limit increase"
            echo "Listing existing VPCs:"
            aws ec2 describe-vpcs --region ap-south-1 --query 'Vpcs[*].[VpcId,Tags[?Key==`Name`].Value|[0],CidrBlock]' --output table
          else
            echo "✅ VPC limit OK ($VPC_COUNT/$VPC_LIMIT)"
          fi

      - name: Terraform Apply
        working-directory: infra/envs/dev
        run: |
          # Apply with detailed logging
          terraform apply -auto-approve tfplan
          
          echo "✅ Terraform apply completed successfully"
          
          # If there were warnings about missing resources, they've been automatically removed from state
          echo "📋 Final resource count:"
          terraform state list | wc -l

      - name: Export outputs
        id: tf-outputs
        working-directory: infra/envs/dev
        run: |
          echo "api_endpoint=$(terraform output -raw api_endpoint)" >> $GITHUB_OUTPUT
          echo "s3_admin_bucket=$(terraform output -raw s3_admin_bucket)" >> $GITHUB_OUTPUT
          echo "s3_vendor_bucket=$(terraform output -raw s3_vendor_bucket)" >> $GITHUB_OUTPUT
          echo "s3_customer_bucket=$(terraform output -raw s3_customer_bucket)" >> $GITHUB_OUTPUT
          echo "cloudfront_admin_id=$(terraform output -raw cloudfront_admin_distribution_id)" >> $GITHUB_OUTPUT
          echo "cloudfront_vendor_id=$(terraform output -raw cloudfront_vendor_distribution_id)" >> $GITHUB_OUTPUT
          echo "cloudfront_customer_id=$(terraform output -raw cloudfront_customer_distribution_id)" >> $GITHUB_OUTPUT

  # ============================================
  # DEPLOY FRONTEND APPS
  # ============================================
  deploy-frontend:
    name: 🌐 Deploy Frontend Apps
    runs-on: ubuntu-latest
    needs: terraform-apply
    strategy:
      matrix:
        include:
          - app: admin-web
            bucket_output: s3_admin_bucket
            cloudfront_output: cloudfront_admin_id
          - app: vendor-web
            bucket_output: s3_vendor_bucket
            cloudfront_output: cloudfront_vendor_id
          - app: customer-web
            bucket_output: s3_customer_bucket
            cloudfront_output: cloudfront_customer_id
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-${{ matrix.app }}
          path: dist

      - name: Deploy to S3
        run: |
          aws s3 sync dist/ s3://${{ needs.terraform-apply.outputs[matrix.bucket_output] }}/ --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.terraform-apply.outputs[matrix.cloudfront_output] }} \
            --paths "/*"

  # ============================================
  # DATABASE MIGRATIONS
  # ============================================
  database-migrations:
    name: 🗄️ Run Database Migrations
    runs-on: ubuntu-latest
    needs: terraform-apply
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Get database credentials
        id: db-creds
        working-directory: infra/envs/dev
        run: |
          terraform init -backend-config=backend.hcl
          
          RDS_ENDPOINT=$(terraform output -raw rds_endpoint)
          RDS_SECRET_ARN=$(terraform output -raw rds_secret_arn)
          RDS_DB_NAME=$(terraform output -raw rds_database_name)
          RDS_PORT=$(terraform output -raw rds_port)
          
          DB_SECRET=$(aws secretsmanager get-secret-value --secret-id "$RDS_SECRET_ARN" --query SecretString --output text)
          DB_PASSWORD=$(echo "$DB_SECRET" | jq -r '.password // .Password // .')
          DB_USERNAME=$(echo "$DB_SECRET" | jq -r '.username // .Username // "postgres"')
          
          DATABASE_URL="postgresql://${DB_USERNAME}:${DB_PASSWORD}@${RDS_ENDPOINT}:${RDS_PORT}/${RDS_DB_NAME}"
          
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$DATABASE_URL"
          echo "database_url=$DATABASE_URL" >> $GITHUB_OUTPUT

      - name: Run migrations
        working-directory: db
        run: |
          npm ci
          npm run migrate:up
        env:
          DATABASE_URL: ${{ steps.db-creds.outputs.database_url }}
          ENVIRONMENT: dev

      - name: Verify migrations
        working-directory: db
        run: npm run migrate:status
        env:
          DATABASE_URL: ${{ steps.db-creds.outputs.database_url }}

  # ============================================
  # SEED DATA
  # ============================================
  seed-data:
    name: 🌱 Seed Base Data
    runs-on: ubuntu-latest
    needs: database-migrations
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Get database credentials
        id: db-creds
        working-directory: infra/envs/dev
        run: |
          terraform init -backend-config=backend.hcl
          
          RDS_ENDPOINT=$(terraform output -raw rds_endpoint)
          RDS_SECRET_ARN=$(terraform output -raw rds_secret_arn)
          RDS_DB_NAME=$(terraform output -raw rds_database_name)
          RDS_PORT=$(terraform output -raw rds_port)
          
          DB_SECRET=$(aws secretsmanager get-secret-value --secret-id "$RDS_SECRET_ARN" --query SecretString --output text)
          DB_PASSWORD=$(echo "$DB_SECRET" | jq -r '.password // .Password // .')
          DB_USERNAME=$(echo "$DB_SECRET" | jq -r '.username // .Username // "postgres"')
          
          DATABASE_URL="postgresql://${DB_USERNAME}:${DB_PASSWORD}@${RDS_ENDPOINT}:${RDS_PORT}/${RDS_DB_NAME}"
          
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$DATABASE_URL"
          echo "database_url=$DATABASE_URL" >> $GITHUB_OUTPUT

      - name: Seed database
        working-directory: db
        run: |
          npm ci
          npm run seed:dev
        env:
          DATABASE_URL: ${{ steps.db-creds.outputs.database_url }}
          ENVIRONMENT: dev

  # ============================================
  # SMOKE TESTS
  # ============================================
  smoke-tests:
    name: 💨 Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-frontend, seed-data]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test API endpoint
        run: |
          echo "Testing API health endpoint..."
          curl -f https://dev.api.warmpawz.com/health || echo "API health check pending..."

      - name: Test frontend URLs
        run: |
          echo "Testing frontend URLs..."
          curl -f https://dev.admin.warmpawz.com || echo "Admin app pending..."
          curl -f https://dev.vendor.warmpawz.com || echo "Vendor app pending..."
          curl -f https://dev.customer.warmpawz.com || echo "Customer app pending..."

  # ============================================
  # DEPLOYMENT SUMMARY
  # ============================================
  deployment-summary:
    name: 📊 Deployment Summary
    runs-on: ubuntu-latest
    needs: [smoke-tests, build-mobile-android]
    if: always()
    steps:
      - name: Download Android APKs
        uses: actions/download-artifact@v4
        with:
          pattern: android-*
          path: mobile-apks/
          merge-multiple: true

      - name: List artifacts
        run: |
          echo "📱 Mobile APKs built:"
          ls -la mobile-apks/ || echo "No APKs found"

      - name: Generate deployment report
        run: |
          echo "# 🚀 Development Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** dev" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🌐 Deployed URLs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| App | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| API | https://dev.api.warmpawz.com |" >> $GITHUB_STEP_SUMMARY
          echo "| Admin | https://dev.admin.warmpawz.com |" >> $GITHUB_STEP_SUMMARY
          echo "| Vendor | https://dev.vendor.warmpawz.com |" >> $GITHUB_STEP_SUMMARY
          echo "| Customer | https://dev.customer.warmpawz.com |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📱 Mobile Apps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Android APKs are available as workflow artifacts." >> $GITHUB_STEP_SUMMARY
