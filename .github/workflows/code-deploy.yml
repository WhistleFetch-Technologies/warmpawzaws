name: Code-Only Deployment

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'backend/lambda/**'
      - '.github/workflows/code-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  NODE_VERSION: '20.x'
  AWS_REGION: ap-south-1

jobs:
  build-test:
    name: Build Test All Apps
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Build UI Package
        run: |
          cd packages/ui
          npm install
          npm run build

      - name: Build Admin Web
        run: |
          cd apps/admin-web
          npm install
          npm run build
        continue-on-error: true

      - name: Build Vendor Web
        run: |
          cd apps/vendor-web
          npm install
          npm run build
        continue-on-error: true

      - name: Build Customer Web
        run: |
          cd apps/customer-web
          npm install
          npm run build
        continue-on-error: true

      - name: Build Lambda Backend
        run: |
          cd backend/lambda
          npm install
          npm run build
        continue-on-error: true

      - name: Test Mobile Apps (Type Check)
        run: |
          cd apps/WarmpawzVendor
          npm install
          npx tsc --noEmit || echo "Type check failed, continuing..."
        continue-on-error: true

      - name: Test Mobile Apps (Type Check)
        run: |
          cd apps/WarmpawzCustomer
          npm install
          npx tsc --noEmit || echo "Type check failed, continuing..."
        continue-on-error: true

  deploy-web-apps:
    name: Deploy Web Apps
    needs: build-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: |
          npm install
          cd packages/ui && npm install && npm run build
          cd ../../apps/admin-web && npm install
          cd ../vendor-web && npm install
          cd ../customer-web && npm install

      - name: Build Admin Web
        run: |
          cd apps/admin-web
          npm run build

      - name: Build Vendor Web
        run: |
          cd apps/vendor-web
          npm run build

      - name: Build Customer Web
        run: |
          cd apps/customer-web
          npm run build

      - name: Deploy to S3 (Admin Web)
        run: |
          aws s3 sync apps/admin-web/.next/static s3://${{ secrets.S3_BUCKET_ADMIN }}/_next/static --delete
          aws s3 sync apps/admin-web/.next/server s3://${{ secrets.S3_BUCKET_ADMIN }}/_next/server --delete
          aws s3 sync apps/admin-web/public s3://${{ secrets.S3_BUCKET_ADMIN }}/public --delete
          aws s3 cp apps/admin-web/.next/BUILD_ID s3://${{ secrets.S3_BUCKET_ADMIN }}/BUILD_ID
        continue-on-error: true

      - name: Deploy to S3 (Vendor Web)
        run: |
          aws s3 sync apps/vendor-web/.next/static s3://${{ secrets.S3_BUCKET_VENDOR }}/_next/static --delete
          aws s3 sync apps/vendor-web/.next/server s3://${{ secrets.S3_BUCKET_VENDOR }}/_next/server --delete
          aws s3 sync apps/vendor-web/public s3://${{ secrets.S3_BUCKET_VENDOR }}/public --delete
          aws s3 cp apps/vendor-web/.next/BUILD_ID s3://${{ secrets.S3_BUCKET_VENDOR }}/BUILD_ID
        continue-on-error: true

      - name: Deploy to S3 (Customer Web)
        run: |
          aws s3 sync apps/customer-web/.next/static s3://${{ secrets.S3_BUCKET_CUSTOMER }}/_next/static --delete
          aws s3 sync apps/customer-web/.next/server s3://${{ secrets.S3_BUCKET_CUSTOMER }}/_next/server --delete
          aws s3 sync apps/customer-web/public s3://${{ secrets.S3_BUCKET_CUSTOMER }}/public --delete
          aws s3 cp apps/customer-web/.next/BUILD_ID s3://${{ secrets.S3_BUCKET_CUSTOMER }}/BUILD_ID
        continue-on-error: true

      - name: Invalidate CloudFront (Admin)
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID_ADMIN }} \
            --paths "/*"
        continue-on-error: true

      - name: Invalidate CloudFront (Vendor)
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID_VENDOR }} \
            --paths "/*"
        continue-on-error: true

      - name: Invalidate CloudFront (Customer)
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID_CUSTOMER }} \
            --paths "/*"
        continue-on-error: true

  deploy-lambda:
    name: Deploy Lambda Backend
    needs: build-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Serverless Framework
        run: npm install -g serverless@3

      - name: Deploy Lambda
        run: |
          cd backend/lambda
          npm install
          npm run build
          serverless deploy --stage ${{ github.event.inputs.environment || 'dev' }} --region ${{ env.AWS_REGION }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

