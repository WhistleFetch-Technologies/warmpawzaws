name: Code-Only Deployment

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'backend/lambda/**'
      - '.github/workflows/code-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  NODE_VERSION: '20.x'
  AWS_REGION: ap-south-1

jobs:
  build-test:
    name: Build Test All Apps
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci --legacy-peer-deps

      - name: Build UI Package
        run: |
          cd packages/ui
          npm ci --legacy-peer-deps
          npm run build

      - name: Build API Contracts Package
        run: |
          cd packages/api-contracts
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm run build

      - name: Build Admin Web
        run: |
          cd apps/admin-web
          npm ci --legacy-peer-deps
          npm run build
        continue-on-error: true

      - name: Build Vendor Web
        run: |
          cd apps/vendor-web
          npm ci --legacy-peer-deps
          npm run build
        continue-on-error: true

      - name: Build Customer Web
        run: |
          cd apps/customer-web
          npm ci --legacy-peer-deps
          npm run build
        continue-on-error: true

      - name: Build Lambda Backend
        run: |
          cd backend/lambda
          npm ci --legacy-peer-deps
          npm run build
        continue-on-error: true

      - name: Test Mobile Apps (Type Check)
        run: |
          cd apps/WarmpawzVendor
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npx tsc --noEmit || echo "Type check failed, continuing..."
        continue-on-error: true

      - name: Test Mobile Apps (Type Check)
        run: |
          cd apps/WarmpawzCustomer
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npx tsc --noEmit || echo "Type check failed, continuing..."
        continue-on-error: true

  deploy-web-apps:
    name: Deploy Web Apps (Dev Only)
    needs: build-test
    runs-on: ubuntu-latest
    if: |
      (github.ref == 'refs/heads/develop' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: |
          npm install
          cd packages/ui && npm install && npm run build
          cd ../../apps/admin-web && npm install
          cd ../vendor-web && npm install
          cd ../customer-web && npm install

      - name: Build Admin Web
        run: |
          cd apps/admin-web
          npm run build

      - name: Build Vendor Web
        run: |
          cd apps/vendor-web
          npm run build

      - name: Build Customer Web
        run: |
          cd apps/customer-web
          npm run build

      - name: Verify build outputs exist
        run: |
          echo "🔍 Verifying build outputs..."
          for app in admin-web vendor-web customer-web; do
            if [ ! -d "apps/$app/dist" ]; then
              echo "❌ ERROR: apps/$app/dist directory not found!"
              echo "Build may have failed. Please check the build logs above."
              exit 1
            fi
            echo "✅ apps/$app/dist exists ($(du -sh apps/$app/dist | cut -f1))"
            # Verify index.html exists
            if [ ! -f "apps/$app/dist/index.html" ]; then
              echo "❌ ERROR: apps/$app/dist/index.html not found!"
              exit 1
            fi
            echo "✅ apps/$app/dist/index.html exists"
          done
          echo "✅ All build outputs verified"

      - name: Deploy to S3 (Admin Web)
        run: |
          echo "📦 Deploying Admin Web from dist/ directory..."
          # Verify dist directory exists
          if [ ! -d "apps/admin-web/dist" ]; then
            echo "❌ Error: apps/admin-web/dist directory not found!"
            echo "Build may have failed. Check build logs above."
            exit 1
          fi
          # Sync entire dist directory (includes all static assets and public files)
          aws s3 sync apps/admin-web/dist/ s3://${{ secrets.S3_BUCKET_ADMIN }}/ --delete
          echo "✅ Admin Web deployed successfully"
        continue-on-error: true

      - name: Deploy to S3 (Vendor Web)
        run: |
          echo "📦 Deploying Vendor Web from dist/ directory..."
          # Verify dist directory exists
          if [ ! -d "apps/vendor-web/dist" ]; then
            echo "❌ Error: apps/vendor-web/dist directory not found!"
            echo "Build may have failed. Check build logs above."
            exit 1
          fi
          # Sync entire dist directory (includes all static assets and public files)
          aws s3 sync apps/vendor-web/dist/ s3://${{ secrets.S3_BUCKET_VENDOR }}/ --delete
          echo "✅ Vendor Web deployed successfully"
        continue-on-error: true

      - name: Deploy to S3 (Customer Web)
        run: |
          echo "📦 Deploying Customer Web from dist/ directory..."
          # Verify dist directory exists
          if [ ! -d "apps/customer-web/dist" ]; then
            echo "❌ Error: apps/customer-web/dist directory not found!"
            echo "Build may have failed. Check build logs above."
            exit 1
          fi
          # Sync entire dist directory (includes all static assets and public files)
          aws s3 sync apps/customer-web/dist/ s3://${{ secrets.S3_BUCKET_CUSTOMER }}/ --delete
          echo "✅ Customer Web deployed successfully"
        continue-on-error: true

      - name: Invalidate CloudFront (Admin)
        id: invalidate-admin
        run: |
          echo "🔄 Invalidating CloudFront cache for Admin Web..."
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID_ADMIN }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "invalidation_id=$INVALIDATION_ID" >> $GITHUB_OUTPUT
          echo "✅ CloudFront invalidation created: $INVALIDATION_ID"
          echo "⏳ Note: Full propagation may take 5-15 minutes"
        continue-on-error: true

      - name: Invalidate CloudFront (Vendor)
        id: invalidate-vendor
        run: |
          echo "🔄 Invalidating CloudFront cache for Vendor Web..."
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID_VENDOR }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "invalidation_id=$INVALIDATION_ID" >> $GITHUB_OUTPUT
          echo "✅ CloudFront invalidation created: $INVALIDATION_ID"
          echo "⏳ Note: Full propagation may take 5-15 minutes"
        continue-on-error: true

      - name: Invalidate CloudFront (Customer)
        id: invalidate-customer
        run: |
          echo "🔄 Invalidating CloudFront cache for Customer Web..."
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID_CUSTOMER }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "invalidation_id=$INVALIDATION_ID" >> $GITHUB_OUTPUT
          echo "✅ CloudFront invalidation created: $INVALIDATION_ID"
          echo "⏳ Note: Full propagation may take 5-15 minutes"
        continue-on-error: true

      - name: Wait for CloudFront propagation
        run: |
          echo "⏳ Waiting 30 seconds for CloudFront invalidation to start processing..."
          echo "   (Full global propagation may take 5-15 minutes)"
          sleep 30
          echo "✅ Proceeding with smoke tests"

      - name: Smoke Tests - Admin Web
        run: |
          echo "🧪 Testing Admin Web..."
          ADMIN_URL="https://dfof7mguaa0a5.cloudfront.net"
          
          # Test homepage
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$ADMIN_URL" || echo "000")
          
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "304" ]; then
            echo "✅ Admin Web: Homepage accessible (HTTP $HTTP_CODE)"
          else
            echo "⚠️  Admin Web: Homepage returned HTTP $HTTP_CODE (may still be propagating)"
          fi
          
          # Test that it's not a 404
          if [ "$HTTP_CODE" = "404" ]; then
            echo "❌ Admin Web: 404 error - deployment may have failed"
            exit 1
          fi
        continue-on-error: true

      - name: Smoke Tests - Vendor Web
        run: |
          echo "🧪 Testing Vendor Web..."
          VENDOR_URL="https://d1s6ykkj381k58.cloudfront.net"
          
          # Test homepage
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$VENDOR_URL" || echo "000")
          
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "304" ]; then
            echo "✅ Vendor Web: Homepage accessible (HTTP $HTTP_CODE)"
          else
            echo "⚠️  Vendor Web: Homepage returned HTTP $HTTP_CODE (may still be propagating)"
          fi
          
          # Test that it's not a 404
          if [ "$HTTP_CODE" = "404" ]; then
            echo "❌ Vendor Web: 404 error - deployment may have failed"
            exit 1
          fi
        continue-on-error: true

      - name: Smoke Tests - Customer Web
        run: |
          echo "🧪 Testing Customer Web..."
          CUSTOMER_URL="https://d2aoyjj8ine0wk.cloudfront.net"
          
          # Test homepage
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$CUSTOMER_URL" || echo "000")
          
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "304" ]; then
            echo "✅ Customer Web: Homepage accessible (HTTP $HTTP_CODE)"
          else
            echo "⚠️  Customer Web: Homepage returned HTTP $HTTP_CODE (may still be propagating)"
          fi
          
          # Test that it's not a 404
          if [ "$HTTP_CODE" = "404" ]; then
            echo "❌ Customer Web: 404 error - deployment may have failed"
            exit 1
          fi
        continue-on-error: true

      - name: Smoke Tests Summary
        run: |
          echo ""
          echo "📊 Smoke Test Summary:"
          echo "═══════════════════════════════════════════════════════════════"
          echo "Admin Web:    https://dfof7mguaa0a5.cloudfront.net"
          echo "Vendor Web:   https://d1s6ykkj381k58.cloudfront.net"
          echo "Customer Web: https://d2aoyjj8ine0wk.cloudfront.net"
          echo ""
          echo "Note: CloudFront may take 5-15 minutes to fully propagate globally"
          echo "If tests fail, wait a few minutes and retry manually"

  deploy-lambda:
    name: Deploy Lambda Backend (Dev Only)
    needs: build-test
    runs-on: ubuntu-latest
    if: |
      (github.ref == 'refs/heads/develop' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build API Contracts (for Lambda)
        run: |
          cd packages/api-contracts
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm run build

      - name: Install Serverless Framework
        run: npm install -g serverless@3

      - name: Deploy Lambda
        run: |
          cd backend/lambda
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm run build
          serverless deploy --stage dev --region ${{ env.AWS_REGION }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

