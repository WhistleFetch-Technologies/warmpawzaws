name: "DEV: Frontend Deploy (No Infra)"

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "apps/admin-web/**"
      - "apps/vendor-web/**"
      - "apps/customer-web/**"
      - ".github/workflows/dev-frontend-only.yml"

env:
  AWS_REGION: ap-south-1
  NODE_VERSION: "20"
  TERRAFORM_VERSION: "1.6.6"

jobs:
  build-frontend:
    name: "🎨 Build Frontend (${{ matrix.app }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin-web, vendor-web, customer-web]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Clean build outputs
        working-directory: apps/${{ matrix.app }}
        run: |
          rm -rf dist .next

      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: npm ci --legacy-peer-deps

      - name: Build (static export)
        working-directory: apps/${{ matrix.app }}
        run: npm run build

      - name: Validate build artifact is COMPLETE (no partial dist)
        working-directory: apps/${{ matrix.app }}
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -d dist/_next/static
          # Must have at least 1 CSS + 1 JS chunk
          test "$(find dist/_next/static/css -type f -name '*.css' | wc -l | tr -d ' ')" -ge 1
          test "$(find dist/_next/static/chunks -type f -name '*.js' | wc -l | tr -d ' ')" -ge 1
          # Ensure HTML references Next assets
          grep -q "/_next/static/" dist/index.html

      - name: Upload frontend artifact (atomic)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ matrix.app }}
          path: apps/${{ matrix.app }}/dist
          retention-days: 1

  deploy-frontend:
    name: "🌐 Deploy Frontend (${{ matrix.app }})"
    runs-on: ubuntu-latest
    needs: build-frontend
    strategy:
      matrix:
        include:
          - app: admin-web
            s3_output: s3_admin_bucket
            cf_output: cloudfront_admin_distribution_id
          - app: vendor-web
            s3_output: s3_vendor_bucket
            cf_output: cloudfront_vendor_distribution_id
          - app: customer-web
            s3_output: s3_customer_bucket
            cf_output: cloudfront_customer_distribution_id
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform (READ-ONLY outputs)
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Read deployment targets from Terraform state (NO APPLY)
        id: targets
        working-directory: infra/envs/dev
        run: |
          set -euo pipefail
          terraform init -backend-config=backend.hcl > /dev/null
          echo "api_endpoint=$(terraform output -raw api_endpoint)" >> $GITHUB_OUTPUT
          echo "s3_bucket=$(terraform output -raw ${{ matrix.s3_output }})" >> $GITHUB_OUTPUT
          echo "cf_dist_id=$(terraform output -raw ${{ matrix.cf_output }})" >> $GITHUB_OUTPUT

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-${{ matrix.app }}
          path: dist

      - name: Inject runtime-config.js (deploy-time, no rebuild)
        run: |
          set -euo pipefail
          API="${{ steps.targets.outputs.api_endpoint }}"
          # Write JS so it's synchronously available before app code runs
          cat > dist/runtime-config.js <<EOF
          window.__WARMPAWZ_RUNTIME_CONFIG__ = {
            apiBaseUrl: "${API}",
            uatMode: true
          };
          EOF

      - name: Validate deploy payload is COMPLETE (block partial deploy)
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/runtime-config.js
          test -d dist/_next/static
          test "$(find dist/_next/static/css -type f -name '*.css' | wc -l | tr -d ' ')" -ge 1
          test "$(find dist/_next/static/chunks -type f -name '*.js' | wc -l | tr -d ' ')" -ge 1
          grep -q "/_next/static/" dist/index.html

      - name: Deploy to S3 (atomic, validated)
        run: |
          set -euo pipefail
          aws s3 sync dist/ "s3://${{ steps.targets.outputs.s3_bucket }}/" --delete

      - name: Invalidate CloudFront cache
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.targets.outputs.cf_dist_id }}" \
            --paths "/*"


