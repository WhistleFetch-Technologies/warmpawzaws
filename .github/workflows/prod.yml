# =============================================================================
# DEPLOY TO PRODUCTION — Web + Backend + Infra only. NO Android/iOS/Capacitor.
# =============================================================================
# AWS: Same account as dev (057442119249). Same credentials (dev deployment pipeline).
# This workflow:
# - Builds backend (Lambda) then later builds all three web frontends (admin-web, vendor-web, customer-web).
# - Terraform apply: prod uses existing VPC (terraform.tfvars: existing_vpc_id, existing_nat_gateway_id);
#   RDS uses existing DB subnet group in its own VPC (use_existing_subnet_group_vpc); CloudFront (3), SQS, SNS, OpenSearch, secrets.
# - DB migrations + seed (idempotent) against prod RDS.
# - Deploys web assets to prod S3 + CloudFront invalidation.
# - Capacitor/native app build: use mobile-build-android.yml and mobile-build-ios.yml (or add later).
# =============================================================================
name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type "DEPLOY_TO_PRODUCTION" to confirm'
        required: true
        type: string
  push:
    branches:
      - prod
    # When you merge develop → prod and push, this runs; approval is enforced by Environment (repo owner only)

concurrency:
  group: prod-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  TERRAFORM_VERSION: "1.6.0"
  NODE_VERSION: "20"

jobs:
  confirmation-check:
    name: Confirm Production Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation (manual) or pass (push to prod)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.confirmation }}" != "DEPLOY_TO_PRODUCTION" ]; then
              echo "Invalid confirmation. Type DEPLOY_TO_PRODUCTION when running manually."
              exit 1
            fi
            echo "Confirmation verified (manual run)"
          else
            echo "Triggered by push to prod; approval required via Environment (repo owner only)"
          fi

  pre-deployment:
    name: Pre-Deployment
    runs-on: ubuntu-latest
    needs: confirmation-check
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "# Production Deployment Pre-Flight" >> $GITHUB_STEP_SUMMARY
          echo "- Branch/ref: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  build-lambda:
    name: Build Lambda
    runs-on: ubuntu-latest
    needs: pre-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install root dependencies
        run: npm ci
      - name: Build api-contracts (required by Lambda)
        run: cd packages/api-contracts && npm ci && npm run build
      - name: Build backend
        run: npm run build:backend
      - name: Package Lambda
        run: npm run package:lambda
      - name: Upload Lambda zip
        uses: actions/upload-artifact@v4
        with:
          name: lambda-prod
          path: backend/lambda/api-handler.zip
          retention-days: 7

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: build-lambda
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Download Lambda zip
        uses: actions/download-artifact@v4
        with:
          name: lambda-prod
          path: backend/lambda
      - name: Terraform Init
        working-directory: infra/envs/prod
        run: terraform init -backend-config=backend.hcl
      - name: Terraform Plan
        working-directory: infra/envs/prod
        run: |
          terraform plan \
            -var-file=terraform.tfvars \
            -var="opensearch_master_password=${{ secrets.PROD_OPENSEARCH_PASSWORD }}" \
            -out=tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-prod
          path: infra/envs/prod/tfplan

  final-approval:
    name: Final Approval
    runs-on: ubuntu-latest
    needs: terraform-plan
    # Repo owner bypass: on push to prod use environment with no reviewers; on manual run use production-approval
    environment: ${{ github.event_name == 'workflow_dispatch' && 'production-approval' || 'production-auto' }}
    steps:
      - run: echo "Production deployment approved (auto on push to prod)"

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: final-approval
    # Repo owner bypass: on push to prod use environment with no reviewers; on manual use production
    environment: ${{ github.event_name == 'workflow_dispatch' && 'production' || 'production-auto' }}
    outputs:
      api_endpoint: ${{ steps.export.outputs.api_endpoint }}
      cloudfront_admin_id: ${{ steps.export.outputs.cloudfront_admin_id }}
      cloudfront_vendor_id: ${{ steps.export.outputs.cloudfront_vendor_id }}
      cloudfront_customer_id: ${{ steps.export.outputs.cloudfront_customer_id }}
      bucket_admin: ${{ steps.export.outputs.bucket_admin }}
      bucket_vendor: ${{ steps.export.outputs.bucket_vendor }}
      bucket_customer: ${{ steps.export.outputs.bucket_customer }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-prod
          path: infra/envs/prod
      - name: Download Lambda zip
        uses: actions/download-artifact@v4
        with:
          name: lambda-prod
          path: backend/lambda
      - name: Terraform Init
        working-directory: infra/envs/prod
        run: terraform init -backend-config=backend.hcl
      - name: Import existing RDS instance if needed
        working-directory: infra/envs/prod
        run: |
          # Check if RDS instance exists in AWS
          if aws rds describe-db-instances --db-instance-identifier warmpawz-prod-instance-1 --region ap-south-1 >/dev/null 2>&1; then
            # Try to import - will fail gracefully if already in state
            terraform import module.rds.aws_rds_cluster_instance.main[0] warmpawz-prod-instance-1 2>&1 | grep -v "Resource already managed" || echo "RDS instance already in state or import failed (continuing...)"
          else
            echo "RDS instance does not exist in AWS (will be created if needed)"
          fi
      - name: Terraform Apply
        working-directory: infra/envs/prod
        run: terraform apply -auto-approve tfplan
      - name: Export outputs
        id: export
        working-directory: infra/envs/prod
        run: |
          echo "api_endpoint=$(terraform output -raw api_endpoint)" >> $GITHUB_OUTPUT
          CF_JSON=$(terraform output -json cloudfront_distribution_ids)
          echo "cloudfront_admin_id=$(echo "$CF_JSON" | jq -r '.admin')" >> $GITHUB_OUTPUT
          echo "cloudfront_vendor_id=$(echo "$CF_JSON" | jq -r '.vendor')" >> $GITHUB_OUTPUT
          echo "cloudfront_customer_id=$(echo "$CF_JSON" | jq -r '.customer')" >> $GITHUB_OUTPUT
          BUCKET_JSON=$(terraform output -json prod_frontend_bucket_names)
          echo "bucket_admin=$(echo "$BUCKET_JSON" | jq -r '.admin')" >> $GITHUB_OUTPUT
          echo "bucket_vendor=$(echo "$BUCKET_JSON" | jq -r '.vendor')" >> $GITHUB_OUTPUT
          echo "bucket_customer=$(echo "$BUCKET_JSON" | jq -r '.customer')" >> $GITHUB_OUTPUT

  database-migrations:
    name: Database Migrations
    runs-on: ubuntu-latest
    needs: terraform-apply
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Get database URL
        id: db
        working-directory: infra/envs/prod
        run: |
          terraform init -backend-config=backend.hcl
          RDS_ENDPOINT=$(terraform output -raw rds_endpoint)
          RDS_SECRET_ARN=$(terraform output -raw rds_secret_arn)
          RDS_DB_NAME=$(terraform output -raw rds_database_name)
          RDS_PORT=$(terraform output -raw rds_port)
          DB_SECRET=$(aws secretsmanager get-secret-value --secret-id "$RDS_SECRET_ARN" --query SecretString --output text)
          DB_PASSWORD=$(echo "$DB_SECRET" | jq -r '.password // .Password // .')
          DB_USERNAME=$(echo "$DB_SECRET" | jq -r '.username // .Username // "postgres"')
          echo "::add-mask::$DB_PASSWORD"
          echo "database_url=postgresql://${DB_USERNAME}:${DB_PASSWORD}@${RDS_ENDPOINT}:${RDS_PORT}/${RDS_DB_NAME}" >> $GITHUB_OUTPUT
      - name: Run migrations
        working-directory: db
        run: |
          npm ci
          npm run migrate:up
        env:
          DATABASE_URL: ${{ steps.db.outputs.database_url }}
          ENVIRONMENT: prod
      - name: Migrations status
        working-directory: db
        run: npm run migrate:status
        env:
          DATABASE_URL: ${{ steps.db.outputs.database_url }}
      # Baseline seed only: 047 (roles) + 048 (service catalog). Full admin config (policies, tax, onboarding, etc.) is one-time bootstrap (export/import), not in pipeline.
      - name: Seed prod baseline (idempotent)
        working-directory: db
        run: npm run seed:prod
        env:
          DATABASE_URL: ${{ steps.db.outputs.database_url }}
          ENVIRONMENT: prod

  build-frontends:
    name: Build Web Frontends
    runs-on: ubuntu-latest
    needs: [terraform-apply, database-migrations]
    outputs:
      api_endpoint: ${{ needs.terraform-apply.outputs.api_endpoint }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build admin-web (prod)
        run: |
          cd apps/admin-web && npm ci && npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ needs.terraform-apply.outputs.api_endpoint }}
      - name: Build vendor-web (prod)
        run: |
          cd apps/vendor-web && npm ci && npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ needs.terraform-apply.outputs.api_endpoint }}
      - name: Build customer-web (prod)
        run: |
          cd apps/customer-web && npm ci && npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ needs.terraform-apply.outputs.api_endpoint }}
      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontends-prod
          path: |
            apps/admin-web/dist
            apps/vendor-web/dist
            apps/customer-web/dist
          retention-days: 1

  deploy-web:
    name: Deploy Web to Prod (S3 + CloudFront)
    runs-on: ubuntu-latest
    needs: [terraform-apply, build-frontends]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Download frontends
        uses: actions/download-artifact@v4
        with:
          name: frontends-prod
      - name: Inject runtime-config.js (prod API URL)
        run: |
          API="${{ needs.terraform-apply.outputs.api_endpoint }}"
          for app in admin-web vendor-web customer-web; do
            D="apps/${app}/dist"
            [ -d "$D" ] || continue
            printf '%s\n' "(function(){var u=\"$API\";window.__WARMPAWZ_RUNTIME_CONFIG__={apiBaseUrl:u,uatMode:false};if(typeof __API_BASE_URL__===\"undefined\"){window.__API_BASE_URL__=u;}}());" > "$D/runtime-config.js"
          done
      - name: Deploy admin-web to S3
        run: |
          aws s3 sync apps/admin-web/dist s3://${{ needs.terraform-apply.outputs.bucket_admin }} --delete
      - name: Deploy vendor-web to S3
        run: |
          aws s3 sync apps/vendor-web/dist s3://${{ needs.terraform-apply.outputs.bucket_vendor }} --delete
      - name: Deploy customer-web to S3
        run: |
          aws s3 sync apps/customer-web/dist s3://${{ needs.terraform-apply.outputs.bucket_customer }} --delete
      - name: Invalidate CloudFront (admin)
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ needs.terraform-apply.outputs.cloudfront_admin_id }} --paths "/*"
      - name: Invalidate CloudFront (vendor)
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ needs.terraform-apply.outputs.cloudfront_vendor_id }} --paths "/*"
      - name: Invalidate CloudFront (customer)
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ needs.terraform-apply.outputs.cloudfront_customer_id }} --paths "/*"

  warmup-lambdas:
    name: Warm Up Lambdas
    runs-on: ubuntu-latest
    needs: [terraform-apply, deploy-web]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Warmup
        run: |
          chmod +x scripts/warmup-lambdas.sh
          ./scripts/warmup-lambdas.sh prod || true

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: warmup-lambdas
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: npm run test:smoke:prod || echo "Smoke tests skipped or failed"
        env:
          ENVIRONMENT: prod

  final-readiness:
    name: Readiness Report
    runs-on: ubuntu-latest
    needs: [terraform-apply, deploy-web, warmup-lambdas]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - run: |
          chmod +x scripts/readiness-checks.sh
          ./scripts/readiness-checks.sh prod || true
      - run: |
          echo "# Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- API: ${{ needs.terraform-apply.outputs.api_endpoint }}" >> $GITHUB_STEP_SUMMARY

  tag-release:
    name: Tag Release
    runs-on: ubuntu-latest
    needs: [final-readiness, smoke-tests]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          VERSION=$(date +%Y.%m.%d).${{ github.run_number }}
          git tag -a "v$VERSION" -m "Production release v$VERSION"
          git push origin "v$VERSION"
