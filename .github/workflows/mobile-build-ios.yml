name: Build iOS Apps

# Capacitor/iOS separate from prod deploy. Only develop or manual trigger.
on:
  push:
    branches: [develop]
    paths:
      - 'apps/WarmpawzCustomer/**'
      - 'apps/WarmpawzVendor/**'
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app to build'
        required: true
        default: 'both'
        type: choice
        options:
          - customer
          - vendor
          - both

env:
  NODE_VERSION: '18'

jobs:
  build-customer-ios:
    name: Build Customer App (iOS)
    runs-on: macos-latest
    if: github.event.inputs.app != 'vendor'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: apps/WarmpawzCustomer
        run: npm ci

      - name: Install CocoaPods
        working-directory: apps/WarmpawzCustomer/ios
        run: pod install

      - name: Setup Code Signing
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          echo -n "$CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          security import $CERTIFICATE_PATH -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Install provisioning profile
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Build iOS App
        working-directory: apps/WarmpawzCustomer/ios
        run: |
          xcodebuild -workspace WarmpawzCustomerTemp.xcworkspace \
            -scheme WarmpawzCustomerTemp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/WarmpawzCustomer.xcarchive \
            archive

      - name: Export IPA
        working-directory: apps/WarmpawzCustomer/ios
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/WarmpawzCustomer.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Upload IPA to S3
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
      
      - name: Upload to S3
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          aws s3 cp "$RUNNER_TEMP/export/WarmpawzCustomerTemp.ipa" \
            "s3://warmpawz-builds/ios/customer/warmpawz-customer-${TIMESTAMP}.ipa"
          aws s3 cp "$RUNNER_TEMP/export/WarmpawzCustomerTemp.ipa" \
            "s3://warmpawz-builds/ios/customer/warmpawz-customer-latest.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: customer-ios
          path: ${{ runner.temp }}/export/*.ipa

  build-vendor-ios:
    name: Build Vendor App (iOS)
    runs-on: macos-latest
    if: github.event.inputs.app != 'customer'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: apps/WarmpawzVendor
        run: npm ci

      - name: Install CocoaPods
        working-directory: apps/WarmpawzVendor/ios
        run: pod install

      - name: Setup Code Signing
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_VENDOR_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          echo -n "$CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          security import $CERTIFICATE_PATH -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Build iOS App
        working-directory: apps/WarmpawzVendor/ios
        run: |
          xcodebuild -workspace WarmpawzVendorTemp.xcworkspace \
            -scheme WarmpawzVendorTemp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/WarmpawzVendor.xcarchive \
            archive

      - name: Export IPA
        working-directory: apps/WarmpawzVendor/ios
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/WarmpawzVendor.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Upload IPA to S3
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
      
      - name: Upload to S3
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          aws s3 cp "$RUNNER_TEMP/export/WarmpawzVendorTemp.ipa" \
            "s3://warmpawz-builds/ios/vendor/warmpawz-vendor-${TIMESTAMP}.ipa"
          aws s3 cp "$RUNNER_TEMP/export/WarmpawzVendorTemp.ipa" \
            "s3://warmpawz-builds/ios/vendor/warmpawz-vendor-latest.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendor-ios
          path: ${{ runner.temp }}/export/*.ipa

